<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Events</title>
    <link rel="stylesheet" href="theme.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body class="bg-gray-900 min-h-screen p-4 md:p-8 text-gray-100">
<nav class="app-nav">
    <div class="app-nav-head">
        <span class="app-nav-title">Plotting</span>
        <button id="menuToggle" class="menu-toggle" type="button" aria-expanded="false" aria-controls="appMenu" aria-label="Toggle menu">
            <span class="menu-toggle-bar"></span>
            <span class="menu-toggle-bar"></span>
            <span class="menu-toggle-bar"></span>
        </button>
    </div>
    <ul id="appMenu" class="menu app-menu">
        <li><a href="Characters.html">Characters</a></li>
        <li><a href="Events.html">Events</a></li>
        <li><a href="Plots.html">Plots</a></li>
        <li><a href="Adventures.html">Adventures</a></li>
    </ul>
</nav>
<div class="max-w-5xl mx-auto">

    <header class="mb-6 flex items-center justify-between flex-wrap gap-3">
        <h1 class="text-3xl font-bold text-teal-400">Events</h1>
        <div class="flex gap-2 flex-wrap">
            <input type="file" id="fileInput" accept=".xlsx,.xls,.csv" class="hidden">
            <button id="btnImport" class="px-3 py-2 bg-gray-700 hover:bg-gray-600 rounded-lg text-sm transition-colors">&#8593; Import</button>
            <button id="btnExport" class="px-3 py-2 bg-gray-700 hover:bg-gray-600 rounded-lg text-sm transition-colors">&#8595; Export</button>
            <button id="btnAdd" class="px-4 py-2 bg-teal-600 hover:bg-teal-500 rounded-lg font-medium transition-colors">+ Add Event</button>
        </div>
    </header>

    <div class="mb-4">
        <input type="text" id="searchInput" placeholder="Search all columns…" class="px-3 py-1 bg-gray-700 border border-gray-600 rounded text-sm text-gray-100 focus:outline-none focus:border-teal-500 w-56">
    </div>
    <div class="overflow-x-auto rounded-lg border border-gray-700">
        <table class="w-full text-sm">
            <thead class="bg-gray-800 text-gray-400 uppercase text-xs">
                <tr>
                    <th class="px-4 py-3 text-left cursor-pointer select-none hover:text-gray-200" data-sort="name" data-label="Name" onclick="setSort('name')">Name</th>
                    <th class="px-4 py-3 text-left cursor-pointer select-none hover:text-gray-200" data-sort="code" data-label="Event Code" onclick="setSort('code')">Event Code</th>
                    <th class="px-4 py-3 text-left cursor-pointer select-none hover:text-gray-200" data-sort="date" data-label="Date" onclick="setSort('date')">Date</th>
                    <th class="px-4 py-3 text-left cursor-pointer select-none hover:text-gray-200" data-sort="location" data-label="Location" onclick="setSort('location')">Location</th>
                    <th class="px-4 py-3 text-left cursor-pointer select-none hover:text-gray-200" data-sort="description" data-label="Description" onclick="setSort('description')">Description</th>
                    <th class="px-4 py-3 text-center w-24">Actions</th>
                </tr>
            </thead>
            <tbody id="tableBody" class="divide-y divide-gray-700">
                <tr><td colspan="5" class="px-4 py-8 text-center text-gray-500">Loading…</td></tr>
            </tbody>
        </table>
    <!-- Debug output panel -->
    <div class="mt-6">
        <div class="flex items-center justify-between mb-1">
            <span class="text-xs text-gray-500 font-mono uppercase tracking-wide">Debug Output</span>
            <button id="btnClearDebug" class="text-xs text-gray-600 hover:text-gray-400 transition-colors">Clear</button>
        </div>
        <div id="debugOutput" class="bg-gray-950 border border-gray-700 rounded-lg p-3 font-mono text-xs text-gray-400 min-h-10 max-h-48 overflow-y-auto whitespace-pre-wrap"></div>
    </div>
</div>

<!-- Modal -->
<div id="modal" class="fixed inset-0 bg-black/60 flex items-center justify-center z-50 hidden p-4">
    <div class="bg-gray-800 rounded-xl p-6 w-full max-w-lg shadow-2xl">
        <h2 id="modalTitle" class="text-xl font-bold text-teal-400 mb-4">Add Event</h2>
        <form id="form" class="space-y-3">
            <div>
                <label class="block text-sm text-gray-300 mb-1">Name <span class="text-red-400">*</span></label>
                <input id="fName" type="text" required class="w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded-lg text-gray-100 focus:outline-none focus:border-teal-500">
            </div>
            <div>
                <label class="block text-sm text-gray-300 mb-1">Event Code</label>
                <input id="fCode" type="text" class="w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded-lg text-gray-100 focus:outline-none focus:border-teal-500">
            </div>
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-sm text-gray-300 mb-1">Date</label>
                    <input id="fDate" type="date" class="w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded-lg text-gray-100 focus:outline-none focus:border-teal-500">
                </div>
                <div>
                    <label class="block text-sm text-gray-300 mb-1">Location</label>
                    <input id="fLocation" type="text" class="w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded-lg text-gray-100 focus:outline-none focus:border-teal-500">
                </div>
            </div>
            <div>
                <label class="block text-sm text-gray-300 mb-1">Description</label>
                <textarea id="fDescription" rows="4" class="w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded-lg text-gray-100 resize-none focus:outline-none focus:border-teal-500"></textarea>
            </div>
            <div class="flex gap-3 pt-2 justify-end">
                <button type="button" id="btnCancel" class="px-4 py-2 bg-gray-600 hover:bg-gray-500 rounded-lg transition-colors">Cancel</button>
                <button type="submit" class="px-4 py-2 bg-teal-600 hover:bg-teal-500 rounded-lg font-medium transition-colors">Save</button>
            </div>
        </form>
    </div>
</div>

<script>
    if (!firebase.apps.length) {
        firebase.initializeApp({
            apiKey: "AIzaSyCv4W78w1_m-T2zWIJlExgDxvKsiiWdkpg",
            authDomain: "thebigusefultool.firebaseapp.com",
            projectId: "thebigusefultool",
            storageBucket: "thebigusefultool.firebasestorage.app",
            messagingSenderId: "992556432736",
            appId: "1:992556432736:web:d672c06e0debd248f67205"
        });
    }
    const db  = firebase.firestore();
    const col = db.collection('plotting_events');

    let allDocs    = [];
    let editingId  = null;
    let sortCol    = 'date';
    let sortDir    = 'desc';
    let searchText = '';

    function esc(s) {
        return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function fmtDate(d) {
        if (!d) return '—';
        try { return new Date(d + 'T00:00:00').toLocaleDateString(undefined, { day:'numeric', month:'short', year:'numeric' }); }
        catch(_) { return d; }
    }

    function setSort(col) { if (sortCol === col) { sortDir = sortDir === 'asc' ? 'desc' : 'asc'; } else { sortCol = col; sortDir = 'asc'; } render(); }

    function render() {
        let rows = [...allDocs];
        if (searchText) {
            const q = searchText.toLowerCase();
            rows = rows.filter(ev => [ev.name, ev.code, ev.date, ev.location, ev.description].some(v => String(v || '').toLowerCase().includes(q)));
        }
        rows.sort((a, b) => {
            const av = String(a[sortCol] ?? '').toLowerCase(), bv = String(b[sortCol] ?? '').toLowerCase();
            return sortDir === 'asc' ? av.localeCompare(bv) : bv.localeCompare(av);
        });
        document.querySelectorAll('thead th[data-sort]').forEach(th => { th.textContent = th.dataset.label + (sortCol === th.dataset.sort ? (sortDir === 'asc' ? ' ↑' : ' ↓') : ''); });
        const tbody = document.getElementById('tableBody');
        if (!rows.length) {
            tbody.innerHTML = '<tr><td colspan="6" class="px-4 py-8 text-center text-gray-500">No events yet.</td></tr>';
            return;
        }
        tbody.innerHTML = rows.map(ev => `
            <tr class="hover:bg-gray-800/40 transition-colors">
                <td class="px-4 py-3 font-medium">${esc(ev.name)}</td>
                <td class="px-4 py-3 text-gray-300 whitespace-nowrap">${esc(ev.code || '—')}</td>
                <td class="px-4 py-3 text-gray-300 whitespace-nowrap">${fmtDate(ev.date)}</td>
                <td class="px-4 py-3 text-gray-300">${esc(ev.location || '—')}</td>
                <td class="px-4 py-3 text-gray-400 max-w-xs truncate" title="${esc(ev.description)}">${esc(ev.description || '')}</td>
                <td class="px-4 py-3 text-center whitespace-nowrap">
                    <button onclick="_edit('${ev.id}')" class="text-teal-400 hover:text-teal-300 text-xs mr-3">Edit</button>
                    <button onclick="_del('${ev.id}')"  class="text-red-400  hover:text-red-300  text-xs">Delete</button>
                </td>
            </tr>`).join('');
    }

    col.orderBy('date', 'desc').onSnapshot(snap => {
        allDocs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        render();
    });
    document.getElementById('searchInput').addEventListener('input', e => { searchText = e.target.value.trim(); render(); });

    const modal      = document.getElementById('modal');
    const form       = document.getElementById('form');
    const modalTitle = document.getElementById('modalTitle');

    function openModal(title) { modalTitle.textContent = title; modal.classList.remove('hidden'); }
    function closeModal()     { modal.classList.add('hidden'); form.reset(); editingId = null; }

    document.getElementById('btnAdd').onclick    = () => { editingId = null; openModal('Add Event'); };
    document.getElementById('btnCancel').onclick = closeModal;

    form.addEventListener('submit', async e => {
        e.preventDefault();
        const data = {
            name:        document.getElementById('fName').value.trim(),
            code:        document.getElementById('fCode').value.trim(),
            date:        document.getElementById('fDate').value,
            location:    document.getElementById('fLocation').value.trim(),
            description: document.getElementById('fDescription').value.trim()
        };
        if (editingId) {
            await col.doc(editingId).update(data);
        } else {
            data.createdAt = Date.now();
            await col.add(data);
        }
        closeModal();
    });

    window._edit = id => {
        const ev = allDocs.find(d => d.id === id);
        if (!ev) return;
        editingId = id;
        document.getElementById('fName').value        = ev.name        || '';
        document.getElementById('fCode').value        = ev.code        || '';
        document.getElementById('fDate').value        = ev.date        || '';
        document.getElementById('fLocation').value    = ev.location    || '';
        document.getElementById('fDescription').value = ev.description || '';
        openModal('Edit Event');
    };

    window._del = async id => {
        if (!confirm('Delete this event?')) return;
        await col.doc(id).delete();
    };

    function _dbg(msg) {
        const el = document.getElementById('debugOutput');
        el.textContent += '[' + new Date().toLocaleTimeString() + '] ' + msg + '\n';
        el.scrollTop = el.scrollHeight;
        console.log('[debug]', msg);
    }
    document.getElementById('btnClearDebug').onclick = () => { document.getElementById('debugOutput').textContent = ''; };

    // --- Import / Export -------------------------------------------------------
    const EXPORT_HDRS = ['Name','Event Code','Date','Location','Description'];

    document.getElementById('btnExport').onclick = () => {
        const rows = allDocs.map(ev => [ev.name||'', ev.code||'', ev.date||'', ev.location||'', ev.description||'']);
        const ws = XLSX.utils.aoa_to_sheet([EXPORT_HDRS, ...rows]);
        ws['!cols'] = EXPORT_HDRS.map((h, i) => ({ wch: Math.max(h.length, ...rows.map(r => String(r[i]||'').length), 4) + 2 }));
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, 'Events');
        XLSX.writeFile(wb, 'events.xlsx');
        _dbg('Export: ' + rows.length + ' events written to events.xlsx');
    };

    const fileInput = document.getElementById('fileInput');
    document.getElementById('btnImport').onclick = () => fileInput.click();
    fileInput.addEventListener('change', async e => {
        const file = e.target.files[0]; if (!file) return; fileInput.value = '';
        _dbg('Reading file: ' + file.name);
        const reader = new FileReader();
        reader.onerror = () => _dbg('Error: FileReader could not read the file.');
        reader.onload = async evt => {
            try {
                const wb   = XLSX.read(evt.target.result, { type: 'array' });
                const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: '' });
                _dbg('Parsed ' + rows.length + ' row(s) from sheet "' + wb.SheetNames[0] + '".');
                if (!rows.length) return;
                let added = 0, skipped = 0, errors = 0;
                for (const row of rows) {
                    const name = String(row['Name'] || row['name'] || '').trim();
                    if (!name) { skipped++; continue; }
                    // Normalise Excel date serial numbers to ISO string
                    let date = String(row['Date'] || '').trim();
                    if (/^\d+$/.test(date)) { date = new Date(Math.round((Number(date) - 25569) * 86400000)).toISOString().slice(0, 10); }
                    try {
                        await col.add({
                            name: String(row['Name'] || row['name'] || '').trim(),
                            code: String(row['Event Code'] || row['eventCode'] || row['Code'] || '').trim(),
                            date,
                            location: String(row['Location']||'').trim(),
                            description: String(row['Description']||'').trim(),
                            createdAt: Date.now()
                        });
                        added++;
                    } catch (rowErr) { errors++; _dbg('Row error ("' + name + '"): ' + rowErr.message); }
                }
                _dbg('Import complete: ' + added + ' added, ' + skipped + ' skipped, ' + errors + ' error(s).');
            } catch (err) {
                _dbg('Import failed: ' + err.message);
            }
        };
        reader.readAsArrayBuffer(file);
    });
</script>
<script defer src="nav-loader.js"></script>
</body>
</html>
