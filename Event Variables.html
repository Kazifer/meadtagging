<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Variables</title>
    <link rel="stylesheet" href="theme.css">
    <style>
        .container {
            max-width: 900px;
        }

        .event-form {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 16px;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .field label {
            color: var(--app-muted);
            font-weight: 600;
            font-size: 0.95rem;
        }

        .field input,
        .field select {
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid var(--app-border);
            background: #1f2937;
            color: var(--app-text);
            font-size: 0.95rem;
        }

        .field input:focus,
        .field select:focus {
            outline: 2px solid #00bcd4;
            outline-offset: 1px;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 20px;
        }

        .export-actions {
            margin-top: 12px;
        }

        .io-table-wrap {
            margin-top: 12px;
            border: 1px solid var(--app-border);
            border-radius: 10px;
            overflow: auto;
            background: #111827;
        }

        .io-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 640px;
        }

        .io-table th,
        .io-table td {
            padding: 10px 12px;
            border-bottom: 1px solid var(--app-border);
            text-align: left;
            vertical-align: middle;
        }

        .io-table th {
            background: #0f172a;
            color: #d1d5db;
            font-weight: 700;
            white-space: nowrap;
        }

        .io-table tbody tr:last-child td {
            border-bottom: 0;
        }

        .io-table td:nth-child(2),
        .io-table td:nth-child(3) {
            width: 30%;
        }

        .btn {
            border: 0;
            border-radius: 8px;
            padding: 10px 14px;
            font-weight: 600;
            cursor: pointer;
            transition: filter 0.2s ease;
        }

        .btn:hover {
            filter: brightness(1.06);
        }

        .btn-primary {
            background: #00bcd4;
            color: #0f172a;
        }

        .btn-secondary {
            background: #4a5568;
            color: #edf2f7;
        }

        .status {
            margin-top: 12px;
            color: var(--app-muted);
            min-height: 1.2em;
        }

        .hint {
            margin-top: 8px;
            font-size: 0.92rem;
        }
    </style>
</head>
<body>
    <main class="container">
        <h1>Event Variables</h1>
        <p>Set your event-level values once. They are saved in your browser and automatically restored the next time you open this page.</p>


        <form id="eventVariablesForm" class="event-form" autocomplete="off">
            <div class="field">
                <label for="eventName">Event Name</label>
                <input id="eventName" name="eventName" type="text" placeholder="e.g. Hoping for Summer" />
            </div>

            <div class="field">
                <label for="eventNumber">Event Number</label>
                <input id="eventNumber" name="eventNumber" type="number" min="0" step="1" placeholder="e.g. 10" />
            </div>

            <div class="field">
                <label for="totalEventBuild">Total Event Build</label>
                <input id="totalEventBuild" name="totalEventBuild" type="number" min="0" step="1" placeholder="e.g. 400" />
            </div>

            <div class="field">
                <label for="players">Players</label>
                <input id="players" name="players" type="number" min="0" step="1" placeholder="e.g. 85" />
            </div>

            <div class="field">
                <label for="eventDays">Event Days</label>
                <input id="eventDays" name="eventDays" type="number" min="0" step="1" placeholder="e.g. 3" />
            </div>

            <div class="field">
                <label for="totalAdventures">Total Adventures</label>
                <input id="totalAdventures" name="totalAdventures" type="number" min="0" step="1" placeholder="e.g. 58" />
            </div>

            <div class="field">
                <label for="eventDifficulty">Event Difficulty</label>
                <select id="eventDifficulty" name="eventDifficulty">
                    <option value="hard">Hard</option>
                    <option value="medium" selected>Medium</option>
                    <option value="easy">Easy</option>
                </select>
            </div>
        </form>

        <div class="actions">
            <button id="saveBtn" class="btn btn-primary" type="button">Save</button>
            <button id="resetBtn" class="btn btn-secondary" type="button">Clear Saved Values</button>
        </div>

        <div class="io-table-wrap">
            <table class="io-table" aria-label="Import and export options">
                <thead>
                    <tr>
                        <th>Title</th>
                        <th>Export</th>
                        <th>Import</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>Event Variables</td>
                        <td><button id="exportEventVarsBtn" class="btn btn-secondary" type="button">Export (.xlsx)</button></td>
                        <td><button id="importEventVarsBtn" class="btn btn-secondary" type="button">Import (.xlsx)</button></td>
                    </tr>
                    <tr>
                        <td>Loot Calculation</td>
                        <td><button id="exportLootCalcBtn" class="btn btn-secondary" type="button">Export (.xlsx)</button></td>
                        <td><button id="importLootCalcBtn" class="btn btn-secondary" type="button">Import (.xlsx)</button></td>
                    </tr>
                    <tr>
                        <td>Adventure Listing</td>
                        <td><button id="exportAdventureListingBtn" class="btn btn-secondary" type="button">Export (.xlsx)</button></td>
                        <td><button id="importAdventureListingBtn" class="btn btn-secondary" type="button">Import (.xlsx)</button></td>
                    </tr>
                    <tr>
                        <td>Adventure Levelling</td>
                        <td><button id="exportAdventureLevellingBtn" class="btn btn-secondary" type="button">Export (.xlsx)</button></td>
                        <td><button id="importAdventureLevellingBtn" class="btn btn-secondary" type="button">Import (.xlsx)</button></td>
                    </tr>
                </tbody>
            </table>
        </div>

        <p id="statusMessage" class="status"></p>
        <p class="hint">Tip: values also auto-save when you type.</p>
    </main>

    <script src="event-variables.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script>
        const eventVarsApi = window.EventVariables;
        const adventureStorageKey = 'adventureLevelling.v1';
        const lootAllocationsStorageKey = 'lootCalcAllocated.v1';

        const form = document.getElementById('eventVariablesForm');
        const saveBtn = document.getElementById('saveBtn');
        const resetBtn = document.getElementById('resetBtn');
        const exportEventVarsBtn = document.getElementById('exportEventVarsBtn');
        const exportLootCalcBtn = document.getElementById('exportLootCalcBtn');
        const exportAdventureListingBtn = document.getElementById('exportAdventureListingBtn');
        const exportAdventureLevellingBtn = document.getElementById('exportAdventureLevellingBtn');
        const importEventVarsBtn = document.getElementById('importEventVarsBtn');
        const importLootCalcBtn = document.getElementById('importLootCalcBtn');
        const importAdventureListingBtn = document.getElementById('importAdventureListingBtn');
        const importAdventureLevellingBtn = document.getElementById('importAdventureLevellingBtn');
        const statusMessage = document.getElementById('statusMessage');

        function showStatus(message) {
            statusMessage.textContent = message;
        }

        function getFormData() {
            return {
                eventName: form.eventName.value.trim(),
                eventNumber: form.eventNumber.value,
                totalEventBuild: form.totalEventBuild.value,
                players: form.players.value,
                eventDays: form.eventDays.value,
                totalAdventures: form.totalAdventures.value,
                eventDifficulty: form.eventDifficulty.value
            };
        }

        function setFormData(data) {
            form.eventName.value = data.eventName || '';
            form.eventNumber.value = data.eventNumber || '';
            form.totalEventBuild.value = data.totalEventBuild || '';
            form.players.value = data.players || '';
            form.eventDays.value = data.eventDays || '';
            form.totalAdventures.value = data.totalAdventures || '';
                form.eventDifficulty.value = data.eventDifficulty || 'medium';
        }

        function saveValues() {
            try {
                eventVarsApi?.set(getFormData());
                showStatus('Saved.');
            } catch (error) {
                console.error('Failed to save event variables:', error);
                showStatus('Could not save values in this browser.');
            }
        }

        function loadValues() {
            try {
                const data = eventVarsApi?.get?.();
                const hasValues = data && Object.keys(data).some(key => key !== 'updatedAt' && data[key]);

                if (!hasValues) {
                    showStatus('No saved values yet.');
                    return;
                }

                setFormData(data);
                showStatus('Saved values loaded.');
            } catch (error) {
                console.error('Failed to load event variables:', error);
                showStatus('Could not load saved values.');
            }
        }

        function clearValues() {
            try {
                eventVarsApi?.clear?.();
                form.reset();
                showStatus('Saved values cleared.');
            } catch (error) {
                console.error('Failed to clear event variables:', error);
                showStatus('Could not clear saved values.');
            }
        }

        function parseNumber(value) {
            const parsed = Number(value);
            return Number.isFinite(parsed) ? parsed : 0;
        }

        function parseAdventureCount(value) {
            const parsed = Number(value);
            if (!Number.isFinite(parsed)) return 0;
            return Math.max(0, Math.floor(parsed));
        }

        function normalizeEventLevel(value) {
            const level = String(value || '').trim().toLowerCase();
            if (level === 'min' || level === 'easy') return 'easy';
            if (level === 'max' || level === 'hard') return 'hard';
            return 'medium';
        }

        function titleCaseLevel(value) {
            const level = normalizeEventLevel(value);
            if (level === 'easy') return 'Easy';
            if (level === 'hard') return 'Hard';
            return 'Medium';
        }

        function safeFilePart(value) {
            return String(value || '')
                .trim()
                .replace(/[^a-z0-9-_ ]/gi, '')
                .replace(/\s+/g, '_')
                .replace(/_+/g, '_')
                .replace(/^_+|_+$/g, '') || 'Event';
        }

        function formatNumber(value) {
            const rounded = Math.round((value || 0) * 100) / 100;
            return Number.isFinite(rounded) ? rounded : 0;
        }

        function readStoredAdventureRows() {
            try {
                const raw = localStorage.getItem(adventureStorageKey);
                const parsed = raw ? JSON.parse(raw) : { rows: [] };
                return Array.isArray(parsed?.rows) ? parsed.rows : [];
            } catch (error) {
                console.error('Failed to read adventure rows:', error);
                return [];
            }
        }

        function readLootAllocations() {
            try {
                const raw = localStorage.getItem(lootAllocationsStorageKey);
                const parsed = raw ? JSON.parse(raw) : {};
                return parsed && typeof parsed === 'object' ? parsed : {};
            } catch (error) {
                console.error('Failed to read loot allocations:', error);
                return {};
            }
        }

        function computePerAplRatios(vars) {
            const totalBuild = Math.max(0, parseNumber(vars.totalEventBuild));
            const players = Math.max(0, parseNumber(vars.players));
            const eventDays = Math.max(0, parseNumber(vars.eventDays));
            const totalAdventures = parseAdventureCount(vars.totalAdventures);
            const playersPerAdventure = Math.max(0, parseNumber(vars.playersPerAdventure));
            const eventLevel = normalizeEventLevel(vars.eventDifficulty || 'medium');

            const averageBuild = players > 0 ? (totalBuild / players) : 0;
            const averageLevel = Math.floor((averageBuild / 10) - 4);
            const levelsPerAdventure = averageLevel * playersPerAdventure;
            const totalEventAplEasy = levelsPerAdventure * totalAdventures;
            const totalEventAplMedium = totalEventAplEasy * 1.2;
            const totalEventAplHard = totalEventAplEasy * 1.5;

            let selectedTotalGoal = totalEventAplMedium;
            if (eventLevel === 'hard') selectedTotalGoal = totalEventAplHard;
            else if (eventLevel === 'easy') selectedTotalGoal = totalEventAplEasy;

            const totalSilver = Math.ceil(totalBuild * 1.5);
            const silverPerApl = selectedTotalGoal > 0 ? (totalSilver / selectedTotalGoal) : 0;

            const productionMax = Math.ceil((totalBuild * eventDays) / 5);
            const productionMin = Math.floor(productionMax / 2);
            const productionMid = Math.floor((productionMax + productionMin) / 2);
            let selectedProductionGoal = productionMid;
            if (eventLevel === 'hard') selectedProductionGoal = productionMax;
            else if (eventLevel === 'easy') selectedProductionGoal = productionMin;
            const productionPerApl = selectedTotalGoal > 0 ? (selectedProductionGoal / selectedTotalGoal) : 0;

            return {
                eventLevel,
                selectedTotalGoal,
                silverPerApl,
                productionPerApl,
                totalEventAplEasy,
                totalEventAplMedium,
                totalEventAplHard
            };
        }

        function computeTargetAplByDifficulty(rows, selectedTotalGoal) {
            const counts = { easy: 0, medium: 0, hard: 0 };

            rows.forEach((row) => {
                const difficulty = String(row?.difficulty || '').trim().toLowerCase();
                if (difficulty === 'easy' || difficulty === 'medium' || difficulty === 'hard') {
                    counts[difficulty] += 1;
                }
            });

            const easyScore = counts.easy * 1;
            const mediumScore = counts.medium * 2;
            const hardScore = counts.hard * 3;
            const totalScore = easyScore + mediumScore + hardScore;

            const easyGoal = totalScore > 0 ? (selectedTotalGoal * easyScore / totalScore) : 0;
            const mediumGoal = totalScore > 0 ? (selectedTotalGoal * mediumScore / totalScore) : 0;
            const hardGoal = totalScore > 0 ? (selectedTotalGoal * hardScore / totalScore) : 0;

            return {
                easy: counts.easy > 0 ? (easyGoal / counts.easy) : 0,
                medium: counts.medium > 0 ? (mediumGoal / counts.medium) : 0,
                hard: counts.hard > 0 ? (hardGoal / counts.hard) : 0,
                counts
            };
        }

        function getTargetAplForRow(row, targets) {
            const difficulty = String(row?.difficulty || '').trim().toLowerCase();
            if (difficulty === 'easy') return targets.easy;
            if (difficulty === 'medium') return targets.medium;
            if (difficulty === 'hard') return targets.hard;
            return 0;
        }

        function getXlsx() {
            if (!window.XLSX) {
                showStatus('XLSX library failed to load. Please refresh and try again.');
                return null;
            }
            return window.XLSX;
        }

        function createWorkbookFromRows(sheetName, rows) {
            const xlsx = getXlsx();
            if (!xlsx) return null;

            const workbook = xlsx.utils.book_new();
            const worksheet = xlsx.utils.json_to_sheet(rows);
            xlsx.utils.book_append_sheet(workbook, worksheet, sheetName);
            return { xlsx, workbook };
        }

        function toYesNoBoolean(value) {
            const normalized = String(value || '').trim().toLowerCase();
            return normalized === 'yes' || normalized === 'true' || normalized === '1';
        }

        function pickWorkbookFile() {
            return new Promise((resolve) => {
                const input = document.createElement('input');
                input.type = 'file';
                input.accept = '.xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
                input.style.display = 'none';

                input.addEventListener('change', () => {
                    const file = input.files && input.files[0] ? input.files[0] : null;
                    input.remove();
                    resolve(file);
                }, { once: true });

                document.body.appendChild(input);
                input.click();
            });
        }

        async function readWorkbookFromPicker() {
            const xlsx = getXlsx();
            if (!xlsx) return null;

            const file = await pickWorkbookFile();
            if (!file) return null;

            const buffer = await file.arrayBuffer();
            return xlsx.read(buffer, { type: 'array' });
        }

        function getSheetRows(workbook, preferredName) {
            const xlsx = getXlsx();
            if (!xlsx || !workbook) return [];

            const sheetName = (preferredName && workbook.Sheets[preferredName])
                ? preferredName
                : workbook.SheetNames[0];

            if (!sheetName || !workbook.Sheets[sheetName]) return [];
            return xlsx.utils.sheet_to_json(workbook.Sheets[sheetName], { defval: '' });
        }

        function parseDisplayDifficulty(value) {
            const normalized = String(value || '').trim().toLowerCase();
            if (normalized === 'hard' || normalized === 'max') return 'hard';
            if (normalized === 'easy' || normalized === 'min') return 'easy';
            return 'medium';
        }

        function normalizeAdventureRowFromImport(row, index) {
            const difficultyRaw = row.Difficulty ?? row.difficulty ?? '';
            const difficulty = String(difficultyRaw || '').trim();
            const normalizedDifficulty = normalizeEventLevel(difficulty);
            const silverRaw = row.Silver ?? row.silver ?? '';
            const productionRaw = row.Production ?? row.production ?? '';

            const silverManualColumn = row.SilverIsManual ?? row.silverIsManual;
            const productionManualColumn = row.ProductionIsManual ?? row.productionIsManual;

            const silverManual = String(silverManualColumn || '').trim() !== ''
                ? toYesNoBoolean(silverManualColumn)
                : String(silverRaw).trim() !== '';

            const productionManual = String(productionManualColumn || '').trim() !== ''
                ? toYesNoBoolean(productionManualColumn)
                : String(productionRaw).trim() !== '';

            return {
                no: String(row.No ?? row.no ?? index + 1),
                title: String(row.Title ?? row.title ?? ''),
                type: String(row.Type ?? row.type ?? ''),
                author: String(row.Author ?? row.author ?? ''),
                npcs: String(row.NPCs ?? row.npcs ?? ''),
                difficulty: difficulty ? titleCaseLevel(normalizedDifficulty) : '',
                apl: String(row.Apl ?? row.APL ?? row.apl ?? ''),
                silver: String(silverRaw),
                production: String(productionRaw),
                silverManual,
                productionManual,
                notes: String(row.Notes ?? row.notes ?? ''),
                received: toYesNoBoolean(row.Received ?? row.received),
                processed: toYesNoBoolean(row.Processed ?? row.processed),
                tagged: toYesNoBoolean(row.Tagged ?? row.tagged)
            };
        }

        function exportEventVariables() {
            const vars = eventVarsApi?.get?.() || {};
            const row = {
                EventName: vars.eventName || '',
                EventNumber: vars.eventNumber || '',
                TotalEventBuild: vars.totalEventBuild || '',
                Players: vars.players || '',
                EventDays: vars.eventDays || '',
                TotalAdventures: vars.totalAdventures || '',
                EventDifficulty: titleCaseLevel(vars.eventDifficulty || 'medium'),
                PlayersPerAdventure: vars.playersPerAdventure || '',
                UpdatedAt: vars.updatedAt || ''
            };

            const prepared = createWorkbookFromRows('Event Variables', [row]);
            if (!prepared) return;

            const fileName = `${safeFilePart(vars.eventName)}_Event_Variables.xlsx`;
            prepared.xlsx.writeFile(prepared.workbook, fileName);
            showStatus(`Exported ${fileName}`);
        }

        function buildLootRows(vars) {
            const totalEventBuild = parseNumber(vars.totalEventBuild);
            const players = parseNumber(vars.players);
            const eventDays = parseNumber(vars.eventDays);

            const floorInt = (value) => Math.floor(value);
            const roundInt = (value) => Math.round(value);
            const ceilInt = (value) => Math.ceil(value);
            const computeMid = (maxDrop, minimum) => floorInt((maxDrop + minimum) / 2);

            function createLootRow(label, maxDrop, minimum, options = {}) {
                return {
                    label,
                    maxDrop,
                    minimum,
                    mid: computeMid(maxDrop, minimum),
                    isGroupTotal: Boolean(options.isGroupTotal),
                    childLabels: Array.isArray(options.childLabels) ? options.childLabels : []
                };
            }

            const totalSilver = ceilInt(totalEventBuild * 1.5);
            const type2MagicItems = floorInt((players * eventDays) / 25);
            const type1MagicItems = ceilInt((players * eventDays) / 10);
            const productionItems = ceilInt((totalEventBuild * eventDays) / 5);
            const cantripPages = roundInt((totalEventBuild * eventDays) / 50);

            const totalLevel1 = ceilInt(players * eventDays * 2);
            const p1 = roundInt(totalLevel1 * 0.45);
            const c1 = roundInt(totalLevel1 * 0.1);
            const e1 = roundInt(totalLevel1 * 0.1);
            const s1 = roundInt(totalLevel1 * 0.1);
            const sr1 = roundInt(totalLevel1 * 0.1);
            const v1 = roundInt(totalLevel1 * 0.05);
            const t1 = roundInt(totalLevel1 * 0.05);
            const d1 = roundInt(totalLevel1 * 0.05);

            const totalLevel2 = ceilInt((players * eventDays * 2) / 10);
            const p2 = roundInt(totalLevel2 * 0.4);
            const c2 = roundInt(totalLevel2 * 0.15);
            const e2 = roundInt(totalLevel2 * 0.15);
            const s2 = roundInt(totalLevel2 * 0.15);
            const v2 = roundInt(totalLevel2 * 0.05);
            const t2 = roundInt(totalLevel2 * 0.05);
            const d2 = roundInt(totalLevel2 * 0.05);

            const totalLevel4 = roundInt((players * eventDays) / 25);
            const p4 = roundInt(totalLevel4 * 0.4);
            const c4 = roundInt(totalLevel4 * 0.15);
            const e4 = roundInt(totalLevel4 * 0.15);
            const s4 = roundInt(totalLevel4 * 0.15);
            const v4 = roundInt(totalLevel4 * 0.05);
            const t4 = roundInt(totalLevel4 * 0.05);
            const d4 = roundInt(totalLevel4 * 0.05);

            return [
                createLootRow('Total Silver', totalSilver, totalSilver),
                createLootRow('Type 2 Magic Items', type2MagicItems, floorInt(type2MagicItems / 2)),
                createLootRow('Type 1 Magic Items', type1MagicItems, floorInt(type1MagicItems / 2)),
                createLootRow('Production Items', productionItems, floorInt(productionItems / 2)),
                createLootRow('Cantrip Pages', cantripPages, floorInt(cantripPages / 2)),
                createLootRow('Total Level 1 Formal Components', totalLevel1, floorInt(totalLevel1 / 2), {
                    isGroupTotal: true,
                    childLabels: ['P1', 'C1', 'E1', 'S1', 'SR1', 'V1', 'T1', 'D1']
                }),
                createLootRow('P1', p1, floorInt(p1 / 3)),
                createLootRow('C1', c1, floorInt(c1 / 3)),
                createLootRow('E1', e1, floorInt(e1 / 3)),
                createLootRow('S1', s1, floorInt(s1 / 3)),
                createLootRow('SR1', sr1, floorInt(sr1 / 3)),
                createLootRow('V1', v1, floorInt(v1 / 3)),
                createLootRow('T1', t1, floorInt(t1 / 3)),
                createLootRow('D1', d1, floorInt(d1 / 3)),
                createLootRow('Total Level 2 Formal Components', totalLevel2, floorInt(totalLevel2 / 2), {
                    isGroupTotal: true,
                    childLabels: ['P2', 'C2', 'E2', 'S2', 'V2', 'T2', 'D2']
                }),
                createLootRow('P2', p2, floorInt(p2 / 3)),
                createLootRow('C2', c2, floorInt(c2 / 3)),
                createLootRow('E2', e2, floorInt(e2 / 3)),
                createLootRow('S2', s2, floorInt(s2 / 3)),
                createLootRow('V2', v2, floorInt(v2 / 3)),
                createLootRow('T2', t2, floorInt(t2 / 3)),
                createLootRow('D2', d2, floorInt(d2 / 3)),
                createLootRow('Total Level 4 Formal Components', totalLevel4, floorInt(totalLevel4 / 2), {
                    isGroupTotal: true,
                    childLabels: ['P4', 'C4', 'E4', 'S4', 'V4', 'T4', 'D4']
                }),
                createLootRow('P4', p4, floorInt(p4 / 3)),
                createLootRow('C4', c4, floorInt(c4 / 3)),
                createLootRow('E4', e4, floorInt(e4 / 3)),
                createLootRow('S4', s4, floorInt(s4 / 3)),
                createLootRow('V4', v4, floorInt(v4 / 3)),
                createLootRow('T4', t4, floorInt(t4 / 3)),
                createLootRow('D4', d4, floorInt(d4 / 3))
            ];
        }

        function exportLootCalculation() {
            const vars = eventVarsApi?.get?.() || {};
            const rows = buildLootRows(vars);
            const allocations = readLootAllocations();
            const selectedDifficulty = normalizeEventLevel(vars.eventDifficulty || 'medium');

            const getSelectedValue = (row) => {
                if (selectedDifficulty === 'hard') return row.maxDrop;
                if (selectedDifficulty === 'easy') return row.minimum;
                return row.mid;
            };

            const output = rows.map((row) => {
                let allocated = 0;
                if (row.isGroupTotal) {
                    allocated = row.childLabels.reduce((sum, label) => sum + parseNumber(allocations[label]), 0);
                } else {
                    allocated = parseNumber(allocations[row.label]);
                }

                const selectedAmount = getSelectedValue(row);
                return {
                    ItemType: row.label,
                    Hard: row.maxDrop,
                    Medium: row.mid,
                    Easy: row.minimum,
                    SelectedDifficulty: titleCaseLevel(selectedDifficulty),
                    SelectedAmount: selectedAmount,
                    AllocatedAmount: allocated,
                    RemainingAmount: selectedAmount - allocated,
                    IsGroupTotal: row.isGroupTotal ? 'Yes' : 'No'
                };
            });

            const prepared = createWorkbookFromRows('Loot Calculation', output);
            if (!prepared) return;

            const fileName = `${safeFilePart(vars.eventName)}_Loot_Calculation.xlsx`;
            prepared.xlsx.writeFile(prepared.workbook, fileName);
            showStatus(`Exported ${fileName}`);
        }

        function buildAdventureExportRows() {
            const vars = eventVarsApi?.get?.() || {};
            const sourceRows = readStoredAdventureRows();
            const ratios = computePerAplRatios(vars);
            const targets = computeTargetAplByDifficulty(sourceRows, ratios.selectedTotalGoal);

            return sourceRows.map((row) => {
                const difficulty = String(row?.difficulty || '').trim();
                const normalizedDifficulty = difficulty.toLowerCase();
                const targetApl = getTargetAplForRow(row, targets);
                const aplValue = parseNumber(row?.apl);

                const silverManual = Boolean(row?.silverManual);
                const productionManual = Boolean(row?.productionManual);
                const silverValue = silverManual ? parseNumber(row?.silver) : aplValue * ratios.silverPerApl;
                const productionValue = productionManual ? parseNumber(row?.production) : aplValue * ratios.productionPerApl;

                return {
                    No: row?.no ?? '',
                    Title: row?.title ?? '',
                    Type: row?.type ?? '',
                    Author: row?.author ?? '',
                    NPCs: row?.npcs ?? '',
                    Difficulty: difficulty,
                    TargetApl: formatNumber(targetApl),
                    Apl: row?.apl ?? '',
                    Silver: formatNumber(silverValue),
                    SilverIsManual: silverManual ? 'Yes' : 'No',
                    Production: formatNumber(productionValue),
                    ProductionIsManual: productionManual ? 'Yes' : 'No',
                    Notes: row?.notes ?? '',
                    Received: row?.received ? 'Yes' : 'No',
                    Processed: row?.processed ? 'Yes' : 'No',
                    Tagged: row?.tagged ? 'Yes' : 'No',
                    DifficultyNormalized: normalizedDifficulty
                };
            });
        }

        function exportAdventureListing() {
            const vars = eventVarsApi?.get?.() || {};
            const output = buildAdventureExportRows();

            const prepared = createWorkbookFromRows('Adventure Listing', output);
            if (!prepared) return;

            const fileName = `${safeFilePart(vars.eventName)}_Adventure_Listing.xlsx`;
            prepared.xlsx.writeFile(prepared.workbook, fileName);
            showStatus(`Exported ${fileName}`);
        }

        function exportAdventureLevelling() {
            const vars = eventVarsApi?.get?.() || {};
            const output = buildAdventureExportRows();
            const ratios = computePerAplRatios(vars);

            const summaryRows = [{
                EventName: vars.eventName || '',
                EventNumber: vars.eventNumber || '',
                EventLevel: titleCaseLevel(vars.eventDifficulty || 'medium'),
                PlayersPerAdventure: vars.playersPerAdventure || '',
                TotalEventAplEasy: formatNumber(ratios.totalEventAplEasy),
                TotalEventAplMedium: formatNumber(ratios.totalEventAplMedium),
                TotalEventAplHard: formatNumber(ratios.totalEventAplHard),
                SilverPerApl: formatNumber(ratios.silverPerApl),
                ProductionPerApl: formatNumber(ratios.productionPerApl)
            }];

            const xlsx = getXlsx();
            if (!xlsx) return;
            const workbook = xlsx.utils.book_new();
            xlsx.utils.book_append_sheet(workbook, xlsx.utils.json_to_sheet(summaryRows), 'Summary');
            xlsx.utils.book_append_sheet(workbook, xlsx.utils.json_to_sheet(output), 'Adventures');

            const fileName = `${safeFilePart(vars.eventName)}_Adventure_Levelling.xlsx`;
            xlsx.writeFile(workbook, fileName);
            showStatus(`Exported ${fileName}`);
        }

        async function importEventVariables() {
            try {
                const workbook = await readWorkbookFromPicker();
                if (!workbook) {
                    showStatus('Import cancelled.');
                    return;
                }

                const rows = getSheetRows(workbook, 'Event Variables');
                if (!rows.length) {
                    showStatus('No Event Variables rows found in workbook.');
                    return;
                }

                const row = rows[0] || {};
                const payload = {
                    eventName: row.EventName ?? row.eventName ?? '',
                    eventNumber: row.EventNumber ?? row.eventNumber ?? '',
                    totalEventBuild: row.TotalEventBuild ?? row.totalEventBuild ?? '',
                    players: row.Players ?? row.players ?? '',
                    eventDays: row.EventDays ?? row.eventDays ?? '',
                    totalAdventures: row.TotalAdventures ?? row.totalAdventures ?? '',
                    eventDifficulty: parseDisplayDifficulty(row.EventDifficulty ?? row.eventDifficulty ?? 'medium'),
                    playersPerAdventure: row.PlayersPerAdventure ?? row.playersPerAdventure ?? ''
                };

                eventVarsApi?.set?.(payload);
                setFormData(eventVarsApi?.get?.() || payload);
                showStatus('Imported Event Variables workbook.');
            } catch (error) {
                console.error('Failed to import Event Variables workbook:', error);
                showStatus('Could not import Event Variables workbook.');
            }
        }

        async function importLootCalculation() {
            try {
                const workbook = await readWorkbookFromPicker();
                if (!workbook) {
                    showStatus('Import cancelled.');
                    return;
                }

                const rows = getSheetRows(workbook, 'Loot Calculation');
                if (!rows.length) {
                    showStatus('No Loot Calculation rows found in workbook.');
                    return;
                }

                const allocations = {};
                rows.forEach((row) => {
                    const label = String(row.ItemType ?? row.itemType ?? '').trim();
                    if (!label) return;

                    const isGroup = toYesNoBoolean(row.IsGroupTotal ?? row.isGroupTotal);
                    if (isGroup) return;

                    const amount = parseNumber(row.AllocatedAmount ?? row.allocatedAmount ?? 0);
                    if (amount > 0) {
                        allocations[label] = String(amount);
                    }
                });

                localStorage.setItem(lootAllocationsStorageKey, JSON.stringify(allocations));

                const first = rows[0] || {};
                const selectedDifficulty = first.SelectedDifficulty ?? first.selectedDifficulty;
                if (selectedDifficulty) {
                    eventVarsApi?.set?.({ eventDifficulty: parseDisplayDifficulty(selectedDifficulty) });
                    setFormData(eventVarsApi?.get?.());
                }

                showStatus('Imported Loot Calculation workbook.');
            } catch (error) {
                console.error('Failed to import Loot Calculation workbook:', error);
                showStatus('Could not import Loot Calculation workbook.');
            }
        }

        async function importAdventureListing() {
            try {
                const workbook = await readWorkbookFromPicker();
                if (!workbook) {
                    showStatus('Import cancelled.');
                    return;
                }

                const rows = getSheetRows(workbook, 'Adventure Listing');
                if (!rows.length) {
                    showStatus('No Adventure Listing rows found in workbook.');
                    return;
                }

                const mappedRows = rows.map((row, index) => normalizeAdventureRowFromImport(row, index));
                localStorage.setItem(adventureStorageKey, JSON.stringify({ rows: mappedRows }));
                showStatus('Imported Adventure Listing workbook.');
            } catch (error) {
                console.error('Failed to import Adventure Listing workbook:', error);
                showStatus('Could not import Adventure Listing workbook.');
            }
        }

        async function importAdventureLevelling() {
            try {
                const workbook = await readWorkbookFromPicker();
                if (!workbook) {
                    showStatus('Import cancelled.');
                    return;
                }

                const summaryRows = getSheetRows(workbook, 'Summary');
                const adventureRows = getSheetRows(workbook, 'Adventures');

                if (summaryRows.length) {
                    const row = summaryRows[0] || {};
                    const payload = {
                        eventName: row.EventName ?? row.eventName ?? '',
                        eventNumber: row.EventNumber ?? row.eventNumber ?? '',
                        eventDifficulty: parseDisplayDifficulty(row.EventLevel ?? row.eventLevel ?? 'medium'),
                        playersPerAdventure: row.PlayersPerAdventure ?? row.playersPerAdventure ?? ''
                    };
                    eventVarsApi?.set?.(payload);
                    setFormData(eventVarsApi?.get?.() || payload);
                }

                if (adventureRows.length) {
                    const mappedRows = adventureRows.map((row, index) => normalizeAdventureRowFromImport(row, index));
                    localStorage.setItem(adventureStorageKey, JSON.stringify({ rows: mappedRows }));
                }

                if (!summaryRows.length && !adventureRows.length) {
                    showStatus('No Summary or Adventures sheets found in workbook.');
                    return;
                }

                showStatus('Imported Adventure Levelling workbook.');
            } catch (error) {
                console.error('Failed to import Adventure Levelling workbook:', error);
                showStatus('Could not import Adventure Levelling workbook.');
            }
        }

        saveBtn.addEventListener('click', saveValues);
        resetBtn.addEventListener('click', clearValues);
        exportEventVarsBtn.addEventListener('click', exportEventVariables);
        exportLootCalcBtn.addEventListener('click', exportLootCalculation);
        exportAdventureListingBtn.addEventListener('click', exportAdventureListing);
        exportAdventureLevellingBtn.addEventListener('click', exportAdventureLevelling);
        importEventVarsBtn.addEventListener('click', importEventVariables);
        importLootCalcBtn.addEventListener('click', importLootCalculation);
        importAdventureListingBtn.addEventListener('click', importAdventureListing);
        importAdventureLevellingBtn.addEventListener('click', importAdventureLevelling);
        form.addEventListener('input', saveValues);
        form.addEventListener('change', saveValues);

        loadValues();
    </script>
</body>
</html>
