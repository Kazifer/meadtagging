<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="db-storage.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cantrip Register</title>
    <link rel="stylesheet" href="theme.css">
    <style>
        .container { max-width: 1200px; }
        .intro { color: var(--app-muted); margin-bottom: 14px; }
        .card { border: 1px solid var(--app-border); border-radius: 10px; background: #111827; padding: 14px; margin-bottom: 14px; }
        .field-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
        .field { display: flex; flex-direction: column; gap: 6px; }
        .field-full { grid-column: 1 / -1; }
        .field label { color: var(--app-muted); font-size: 0.9rem; font-weight: 600; }
        .field input, .field select { border: 1px solid var(--app-border); border-radius: 8px; background: #0b1220; color: var(--app-text); padding: 8px 10px; font-size: 0.92rem; }
        .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
        .btn { border: 0; border-radius: 8px; padding: 10px 14px; font-weight: 600; cursor: pointer; color: #f8fafc; background: #2563eb; }
        .btn-secondary { background: #334155; }
        .btn-success { background: #166534; }
        .btn-danger { background: #991b1b; }
        .status { color: var(--app-muted); min-height: 1.2em; margin-top: 10px; }
        .debug-panel { margin-top: 10px; border: 1px dashed var(--app-border); border-radius: 8px; padding: 8px; background: #0b1220; }
        .debug-panel summary { cursor: pointer; color: #cbd5e1; font-weight: 600; }
        .debug-output { margin-top: 8px; white-space: pre-wrap; font-size: 0.82rem; color: #94a3b8; max-height: 220px; overflow: auto; }
        .cantrip-picker { border: 1px solid var(--app-border); border-radius: 10px; background: #0b1220; padding: 10px; }
        .cantrip-search { margin-bottom: 8px; }
        .cantrip-list { max-height: 260px; overflow: auto; border: 1px solid var(--app-border); border-radius: 8px; background: #111827; padding: 6px; }
        .cantrip-option { display: flex; align-items: center; gap: 8px; padding: 6px; border-bottom: 1px solid #1f2937; font-size: 0.9rem; }
        .cantrip-option:last-child { border-bottom: 0; }
        .table-wrap { overflow: auto; border: 1px solid var(--app-border); border-radius: 10px; }
        table { width: 100%; border-collapse: collapse; min-width: 980px; background: #111827; }
        th, td { border-bottom: 1px solid var(--app-border); padding: 10px; text-align: left; vertical-align: top; font-size: 0.9rem; }
        th { background: #0f172a; color: #d1d5db; font-weight: 700; }
        th.sortable { cursor: pointer; user-select: none; }
        th.sortable:hover { background: #172036; }
        .mini-btn { border: 0; border-radius: 6px; padding: 6px 9px; font-size: 0.8rem; cursor: pointer; color: #fff; background: #475569; margin-right: 6px; }
        .mini-btn.delete { background: #b91c1c; }
        .action-cell { white-space: nowrap; }
        @media (max-width: 980px) { .field-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <main class="container">
        <h1>Cantrip Register</h1>
        <p class="intro">Create Cantrip Tomes, manage the register, and optionally save tomes to Event Items.</p>

        <section class="card">
            <div class="field-grid">
                <div class="field">
                    <label for="tomeName">Name</label>
                    <input id="tomeName" type="text" placeholder="Cantrip Tome name">
                </div>
                <div class="field">
                    <label for="eventNumber">Event Number</label>
                    <input id="eventNumber" type="text" placeholder="e.g. 12">
                </div>
                <div class="field">
                    <label for="adventureNumber">Adventure Number</label>
                    <input id="adventureNumber" type="text" placeholder="e.g. 3">
                </div>
                <div class="field">
                    <label for="school">School</label>
                    <select id="school">
                        <option value="">Select school...</option>
                        <option value="Celestial">Celestial</option>
                        <option value="Earth">Earth</option>
                        <option value="Nature">Nature</option>
                        <option value="Mixed">Mixed</option>
                    </select>
                </div>
                <div class="field">
                    <label for="expiryDate">Expiry Date</label>
                    <input id="expiryDate" type="date">
                </div>
                <div class="field">
                    <label for="adventureSelect">Adventure (From Adventure Listing)</label>
                    <select id="adventureSelect"></select>
                </div>

                <div class="field field-full">
                    <label>Cantrip Selection</label>
                    <div class="cantrip-picker">
                        <input id="cantripSearch" class="cantrip-search" type="text" placeholder="Search cantrips...">
                        <div id="cantripList" class="cantrip-list"></div>
                    </div>
                </div>
            </div>

            <div class="actions">
                <button id="newTomeBtn" class="btn btn-secondary" type="button">Create New Cantrip Tome</button>
                <button id="saveTomeBtn" class="btn" type="button">Save Tome</button>
                <button id="saveAndAddBtn" class="btn btn-success" type="button">Save and Add to Event Items</button>
                <button id="clearFormBtn" class="btn btn-secondary" type="button">Clear Form</button>
                <button id="cancelEditBtn" class="btn btn-danger" type="button" style="display:none;">Cancel Edit</button>
            </div>

            <div class="actions">
                <button id="exportBtn" class="btn btn-secondary" type="button">Export Register (.xls)</button>
                <button id="importBtn" class="btn btn-secondary" type="button">Import Register (.xls/.xlsx)</button>
                <button id="clearRegisterBtn" class="btn btn-danger" type="button">Clear Register</button>
                <input id="importInput" type="file" accept=".xls,.xlsx,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" style="display:none;">
            </div>

            <p id="statusMessage" class="status"></p>
            <details class="debug-panel">
                <summary>Import Debug Info</summary>
                <pre id="importDebugOutput" class="debug-output">No import debug output yet.</pre>
            </details>
        </section>

        <section class="table-wrap" aria-label="Cantrip tome register entries">
            <table>
                <thead>
                    <tr>
                        <th class="sortable" data-sort-key="name" data-label="Name">Name</th>
                        <th class="sortable" data-sort-key="eventNumber" data-label="Event #">Event #</th>
                        <th class="sortable" data-sort-key="adventureNumber" data-label="Adventure #">Adventure #</th>
                        <th class="sortable" data-sort-key="school" data-label="School">School</th>
                        <th class="sortable" data-sort-key="expiryDate" data-label="Expiry">Expiry</th>
                        <th class="sortable" data-sort-key="adventure" data-label="Adventure">Adventure</th>
                        <th class="sortable" data-sort-key="cantrips" data-label="Cantrips">Cantrips</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="registerBody"></tbody>
            </table>
        </section>
    </main>

    <script src="event-variables.js"></script>
    <script src="cantrips-data.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script>
        const STORAGE_KEY = 'cantripRegister.v1';
        const ITEM_TAGS_STORAGE_KEY = 'itemTags.items.v2';
        const ADVENTURE_STORAGE_KEY = 'adventureLevelling.v1';

        const tomeNameEl = document.getElementById('tomeName');
        const eventNumberEl = document.getElementById('eventNumber');
        const adventureNumberEl = document.getElementById('adventureNumber');
        const schoolEl = document.getElementById('school');
        const expiryDateEl = document.getElementById('expiryDate');
        const adventureSelectEl = document.getElementById('adventureSelect');
        const cantripSearchEl = document.getElementById('cantripSearch');
        const cantripListEl = document.getElementById('cantripList');

        const newTomeBtn = document.getElementById('newTomeBtn');
        const saveTomeBtn = document.getElementById('saveTomeBtn');
        const saveAndAddBtn = document.getElementById('saveAndAddBtn');
        const clearFormBtn = document.getElementById('clearFormBtn');
        const cancelEditBtn = document.getElementById('cancelEditBtn');
        const exportBtn = document.getElementById('exportBtn');
        const importBtn = document.getElementById('importBtn');
        const importInput = document.getElementById('importInput');
        const clearRegisterBtn = document.getElementById('clearRegisterBtn');

        const statusMessageEl = document.getElementById('statusMessage');
        const importDebugOutputEl = document.getElementById('importDebugOutput');
        const registerBodyEl = document.getElementById('registerBody');
        const sortableHeaderEls = Array.from(document.querySelectorAll('th.sortable'));

        const cantripData = Array.isArray(window.cantripsData) ? window.cantripsData : [];

        let rows = [];
        let editingId = null;
        let selectedCantripIds = new Set();
        let sortState = { key: 'name', direction: 'asc' };

        function showStatus(message) {
            statusMessageEl.textContent = message;
        }

        function showImportDebug(lines) {
            const output = Array.isArray(lines) && lines.length
                ? lines.join('\n')
                : 'No import debug output yet.';
            importDebugOutputEl.textContent = output;
        }

        function normalizeCantripLookupKey(value) {
            return String(value || '')
                .toLowerCase()
                .replace(/[\u2018\u2019]/g, "'")
                .replace(/[\u201C\u201D]/g, '"')
                .replace(/\s+/g, ' ')
                .trim();
        }

        function generateId() {
            return `cantrip-register-${Date.now()}-${Math.floor(Math.random() * 100000)}`;
        }

        function getDefaultExpiryDate() {
            const date = new Date();
            date.setFullYear(date.getFullYear() + 1);
            const y = date.getFullYear();
            const m = String(date.getMonth() + 1).padStart(2, '0');
            const d = String(date.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        function namesFromCantripIds(ids) {
            return ids.map((id) => {
                const match = cantripData.find((item) => String(item?.id) === String(id));
                return String(match?.name || '').trim();
            }).filter(Boolean);
        }

        function normalizeRow(row) {
            const ids = Array.isArray(row?.cantripIds)
                ? row.cantripIds
                : String(row?.cantripIds || '').split('|').map((value) => value.trim()).filter(Boolean);
            const names = Array.isArray(row?.cantripNames)
                ? row.cantripNames
                : String(row?.cantripNames || '').split('|').map((value) => value.trim()).filter(Boolean);

            return {
                id: String(row?.id || generateId()).trim(),
                name: String(row?.name || '').trim(),
                eventNumber: String(row?.eventNumber || '').trim(),
                adventureNumber: String(row?.adventureNumber || '').trim(),
                school: String(row?.school || '').trim(),
                expiryDate: String(row?.expiryDate || '').trim() || getDefaultExpiryDate(),
                adventure: String(row?.adventure || '').trim(),
                cantripIds: ids,
                cantripNames: names.length ? names : namesFromCantripIds(ids)
            };
        }

        function readAdventureOptions() {
            try {
                const raw = localStorage.getItem(ADVENTURE_STORAGE_KEY);
                const parsed = raw ? JSON.parse(raw) : { rows: [] };
                const sourceRows = Array.isArray(parsed?.rows) ? parsed.rows : [];

                return sourceRows.map((row, index) => {
                    const no = String(row?.no || '').trim();
                    const title = String(row?.title || '').trim();
                    if (!no && !title) return null;
                    const label = no && title ? `A${no} - ${title}` : (no ? `A${no}` : title || `Adventure ${index + 1}`);
                    return { label, no: no || '' };
                }).filter(Boolean);
            } catch (error) {
                console.error('Cantrip Register: failed to read adventures', error);
                return [];
            }
        }

        function renderAdventureOptions(selectedLabel = '') {
            const options = readAdventureOptions();
            adventureSelectEl.innerHTML = '';

            const defaultOption = document.createElement('option');
            defaultOption.value = '';
            defaultOption.textContent = options.length
                ? 'Select adventure...'
                : 'No adventures found (fill Adventure Listing first)';
            adventureSelectEl.appendChild(defaultOption);

            const seen = new Set();
            options.forEach((opt) => {
                if (seen.has(opt.label)) return;
                seen.add(opt.label);
                const option = document.createElement('option');
                option.value = opt.label;
                option.textContent = opt.label;
                adventureSelectEl.appendChild(option);
            });

            if (selectedLabel && !seen.has(selectedLabel)) {
                const legacy = document.createElement('option');
                legacy.value = selectedLabel;
                legacy.textContent = `${selectedLabel} (existing)`;
                adventureSelectEl.appendChild(legacy);
            }

            adventureSelectEl.value = selectedLabel;
        }

        function getSelectedAdventureNumberFromLabel(label) {
            const match = String(label || '').match(/A\s*(\d+)/i);
            return match ? match[1] : '';
        }

        function loadRows() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                const parsed = raw ? JSON.parse(raw) : [];
                rows = Array.isArray(parsed) ? parsed.map(normalizeRow) : [];
            } catch (error) {
                console.error('Cantrip Register: failed to load rows', error);
                rows = [];
            }
        }

        function saveRows() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(rows));
        }

        function renderCantripOptions() {
            const query = String(cantripSearchEl.value || '').trim().toLowerCase();
            cantripListEl.innerHTML = '';

            const filtered = cantripData.filter((cantrip) => {
                const name = String(cantrip?.name || '').toLowerCase();
                return !query || name.includes(query);
            });

            if (!filtered.length) {
                const empty = document.createElement('div');
                empty.className = 'cantrip-option';
                empty.textContent = 'No matching cantrips found.';
                cantripListEl.appendChild(empty);
                return;
            }

            filtered.forEach((cantrip) => {
                const id = String(cantrip?.id || '');
                const name = String(cantrip?.name || '').trim();
                const option = document.createElement('label');
                option.className = 'cantrip-option';

                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.value = id;
                checkbox.checked = selectedCantripIds.has(id);

                const labelText = document.createElement('span');
                labelText.textContent = `${name} (${cantrip?.type || '-'})`;

                option.appendChild(checkbox);
                option.appendChild(labelText);
                cantripListEl.appendChild(option);
            });
        }

        function renderRows() {
            registerBodyEl.innerHTML = '';

            if (!rows.length) {
                const tr = document.createElement('tr');
                const td = document.createElement('td');
                td.colSpan = 8;
                td.textContent = 'No cantrip tomes in the register yet.';
                tr.appendChild(td);
                registerBodyEl.appendChild(tr);
                renderSortHeaders();
                return;
            }

            const sortedRows = [...rows].sort((left, right) => {
                const key = sortState.key;
                const direction = sortState.direction === 'desc' ? -1 : 1;

                let leftRaw = '';
                let rightRaw = '';

                if (key === 'cantrips') {
                    leftRaw = (left.cantripNames || []).join(', ');
                    rightRaw = (right.cantripNames || []).join(', ');
                } else {
                    leftRaw = String(left?.[key] ?? '').trim();
                    rightRaw = String(right?.[key] ?? '').trim();
                }

                const leftNumeric = Number(leftRaw);
                const rightNumeric = Number(rightRaw);
                const bothNumeric = Number.isFinite(leftNumeric) && Number.isFinite(rightNumeric) && leftRaw !== '' && rightRaw !== '';

                if (bothNumeric) {
                    return (leftNumeric - rightNumeric) * direction;
                }

                return leftRaw.localeCompare(rightRaw, undefined, { sensitivity: 'base' }) * direction;
            });

            sortedRows.forEach((row) => {
                const tr = document.createElement('tr');
                const cantripPreview = row.cantripNames.slice(0, 3).join(', ');
                const cantripCellText = row.cantripNames.length > 3
                    ? `${cantripPreview} (+${row.cantripNames.length - 3} more)`
                    : (cantripPreview || '-');

                [
                    row.name,
                    row.eventNumber,
                    row.adventureNumber,
                    row.school,
                    row.expiryDate,
                    row.adventure,
                    cantripCellText
                ].forEach((value) => {
                    const td = document.createElement('td');
                    td.textContent = value || '-';
                    tr.appendChild(td);
                });

                const actionTd = document.createElement('td');
                actionTd.className = 'action-cell';

                const editBtn = document.createElement('button');
                editBtn.type = 'button';
                editBtn.className = 'mini-btn';
                editBtn.textContent = 'Edit';
                editBtn.addEventListener('click', () => startEdit(row.id));

                const removeBtn = document.createElement('button');
                removeBtn.type = 'button';
                removeBtn.className = 'mini-btn delete';
                removeBtn.textContent = 'Remove';
                removeBtn.addEventListener('click', () => removeRow(row.id));

                actionTd.appendChild(editBtn);
                actionTd.appendChild(removeBtn);
                tr.appendChild(actionTd);

                registerBodyEl.appendChild(tr);
            });

            renderSortHeaders();
        }

        function renderSortHeaders() {
            sortableHeaderEls.forEach((headerEl) => {
                const key = String(headerEl.dataset.sortKey || '').trim();
                const label = String(headerEl.dataset.label || headerEl.textContent || '').trim();
                const isActive = key === sortState.key;
                const indicator = isActive ? (sortState.direction === 'asc' ? ' ▲' : ' ▼') : '';
                headerEl.textContent = `${label}${indicator}`;
            });
        }

        function toggleSort(key) {
            if (!key) return;

            if (sortState.key === key) {
                sortState.direction = sortState.direction === 'asc' ? 'desc' : 'asc';
            } else {
                sortState = { key, direction: 'asc' };
            }

            renderRows();
        }

        function clearForm() {
            editingId = null;
            selectedCantripIds = new Set();
            tomeNameEl.value = '';
            eventNumberEl.value = String(window.EventVariables?.get?.()?.eventNumber || '').trim();
            adventureNumberEl.value = '';
            schoolEl.value = '';
            expiryDateEl.value = getDefaultExpiryDate();
            renderAdventureOptions('');
            cantripSearchEl.value = '';
            renderCantripOptions();
            saveTomeBtn.textContent = 'Save Tome';
            cancelEditBtn.style.display = 'none';
        }

        function getFormRow() {
            const cantripIds = Array.from(selectedCantripIds);
            const cantripNames = namesFromCantripIds(cantripIds);

            return normalizeRow({
                id: editingId || generateId(),
                name: tomeNameEl.value,
                eventNumber: eventNumberEl.value,
                adventureNumber: adventureNumberEl.value,
                school: schoolEl.value,
                expiryDate: expiryDateEl.value,
                adventure: adventureSelectEl.value,
                cantripIds,
                cantripNames
            });
        }

        function validateRow(row) {
            if (!row.name) return 'Name is required.';
            if (!row.eventNumber) return 'Event Number is required.';
            if (!row.adventureNumber) return 'Adventure Number is required.';
            if (!row.school) return 'School is required.';
            if (!row.expiryDate) return 'Expiry Date is required.';
            if (!row.adventure) return 'Adventure selection is required.';
            if (!row.cantripIds.length) return 'Select at least one cantrip.';
            return '';
        }

        function saveFormRow(pushToEventItems) {
            const wasEditing = Boolean(editingId);
            const row = getFormRow();
            const validationError = validateRow(row);
            if (validationError) {
                showStatus(validationError);
                return;
            }

            if (wasEditing) {
                rows = rows.map((entry) => entry.id === editingId ? row : entry);
            } else {
                rows.unshift(row);
            }

            saveRows();
            renderRows();

            if (pushToEventItems) {
                const pushed = addTomeToEventItems(row);
                clearForm();
                showStatus(pushed
                    ? 'Cantrip Tome saved and added to Event Items.'
                    : 'Cantrip Tome saved, but failed to add to Event Items.');
                return;
            }

            clearForm();
            showStatus(wasEditing ? 'Cantrip Tome updated.' : 'Cantrip Tome saved.');
        }

        function startEdit(id) {
            const row = rows.find((entry) => entry.id === id);
            if (!row) return;

            editingId = row.id;
            selectedCantripIds = new Set((row.cantripIds || []).map((value) => String(value)));
            tomeNameEl.value = row.name;
            eventNumberEl.value = row.eventNumber;
            adventureNumberEl.value = row.adventureNumber;
            schoolEl.value = row.school;
            expiryDateEl.value = row.expiryDate;
            renderAdventureOptions(row.adventure);
            cantripSearchEl.value = '';
            renderCantripOptions();

            saveTomeBtn.textContent = 'Update Tome';
            cancelEditBtn.style.display = 'inline-block';
            showStatus('Editing selected Cantrip Tome.');
        }

        function removeRow(id) {
            rows = rows.filter((entry) => entry.id !== id);
            saveRows();
            renderRows();

            if (editingId === id) {
                clearForm();
            }

            showStatus('Cantrip Tome removed.');
        }

        function normalizeItemTagsPayload(raw) {
            if (!raw) return { title: '', items: [] };

            try {
                const parsed = JSON.parse(raw);
                if (Array.isArray(parsed)) {
                    return { title: '', items: parsed };
                }

                return {
                    title: typeof parsed?.title === 'string' ? parsed.title : '',
                    items: Array.isArray(parsed?.items) ? parsed.items : []
                };
            } catch (error) {
                console.error('Cantrip Register: failed to read item tags payload', error);
                return { title: '', items: [] };
            }
        }

        function addTomeToEventItems(row) {
            try {
                const payload = normalizeItemTagsPayload(localStorage.getItem(ITEM_TAGS_STORAGE_KEY));
                const eventTitle = window.EventVariables?.buildTitle?.(window.EventVariables?.get?.()) || payload.title || '';
                const code = `E${row.eventNumber}A${row.adventureNumber}`;

                payload.items = Array.isArray(payload.items) ? payload.items : [];
                payload.items.unshift({
                    name: row.name,
                    code,
                    adventure: row.adventure,
                    description: `Cantrip Tome - ${row.cantripNames.join(', ')}`,
                    itemValue: '',
                    encodedValue: '',
                    persistantProp: false,
                    enchantment: '',
                    expiry: row.expiryDate
                });

                if (!payload.title && eventTitle) {
                    payload.title = eventTitle;
                }

                localStorage.setItem(ITEM_TAGS_STORAGE_KEY, JSON.stringify(payload));
                return true;
            } catch (error) {
                console.error('Cantrip Register: failed to add Cantrip Tome to Event Items', error);
                return false;
            }
        }

        function exportRegister() {
            if (!rows.length) {
                showStatus('No cantrip tomes to export.');
                return;
            }

            if (!window.XLSX) {
                showStatus('XLSX library failed to load. Refresh and try again.');
                return;
            }

            const eventName = String(window.EventVariables?.get?.()?.eventName || '').trim();
            const safeName = (eventName || 'Event').replace(/[^a-z0-9-_ ]/gi, '').replace(/\s+/g, '_');
            const fileName = `${safeName}_Cantrip_Register.xls`;

            const exportRows = rows.map((row) => ({
                Name: row.name,
                EventNumber: row.eventNumber,
                AdventureNumber: row.adventureNumber,
                School: row.school,
                ExpiryDate: row.expiryDate,
                Adventure: row.adventure,
                CantripIds: row.cantripIds.join('|'),
                Cantrips: row.cantripNames.join('|')
            }));

            const workbook = window.XLSX.utils.book_new();
            const worksheet = window.XLSX.utils.json_to_sheet(exportRows);
            window.XLSX.utils.book_append_sheet(workbook, worksheet, 'Cantrip Register');
            window.XLSX.writeFile(workbook, fileName, { bookType: 'biff8' });
            showStatus(`Exported ${fileName}`);
        }

        async function importRegister(file) {
            if (!window.XLSX) {
                showStatus('XLSX library failed to load. Refresh and try again.');
                return;
            }

            const buffer = await file.arrayBuffer();
            const workbook = window.XLSX.read(buffer, { type: 'array' });
            const sheetName = workbook.Sheets['Cantrip Register'] ? 'Cantrip Register' : workbook.SheetNames[0];

            if (!sheetName) {
                showStatus('Import failed: workbook has no sheets.');
                return;
            }

            const imported = window.XLSX.utils.sheet_to_json(workbook.Sheets[sheetName], { defval: '' });
            if (!imported.length) {
                showStatus('No rows found in workbook.');
                return;
            }

            const lookupByName = new Map();
            cantripData.forEach((entry) => {
                const key = normalizeCantripLookupKey(entry?.name);
                if (key && !lookupByName.has(key)) {
                    lookupByName.set(key, String(entry.id));
                }
            });

            const debugLines = [];
            debugLines.push(`Import file: ${file.name}`);
            debugLines.push(`Imported sheet: ${sheetName}`);
            debugLines.push(`Rows read: ${imported.length}`);
            debugLines.push(`Cantrips in lookup list: ${lookupByName.size}`);
            debugLines.push('');

            const mapped = imported.map((row, rowIndex) => {
                const idsFromFile = String(row.CantripIds ?? row.cantripIds ?? '').trim();
                const namesFromFile = String(row.Cantrips ?? row.cantrips ?? '').trim();

                let cantripNames = namesFromFile
                    ? namesFromFile.split(/\||,|;|\n/).map((value) => value.trim()).filter(Boolean)
                    : [];

                let cantripIds = [];
                const unresolvedNames = [];

                // Import behavior: derive IDs from Cantrip names when names are provided.
                if (cantripNames.length) {
                    cantripIds = cantripNames.map((name) => {
                        const key = normalizeCantripLookupKey(name);
                        const id = lookupByName.get(key);
                        if (!id) {
                            unresolvedNames.push(name);
                            return '';
                        }
                        return id;
                    }).filter(Boolean);
                }

                if (!cantripIds.length && idsFromFile) {
                    cantripIds = idsFromFile.split('|').map((value) => value.trim()).filter(Boolean);
                }

                if (!cantripNames.length && cantripIds.length) {
                    cantripNames = namesFromCantripIds(cantripIds);
                }

                const rawName = String(row.Name ?? row.name ?? '').trim();
                const finalName = rawName || `Imported Tome ${rowIndex + 1}`;

                const hasRowData = Boolean(rawName || String(row.EventNumber ?? row.eventNumber ?? '').trim() || String(row.AdventureNumber ?? row.adventureNumber ?? '').trim() || String(row.Adventure ?? row.adventure ?? '').trim() || cantripNames.length || cantripIds.length);

                debugLines.push(`Row ${rowIndex + 1}: ${rawName || '(Unnamed)'}`);
                debugLines.push(`- Cantrips text: ${namesFromFile || '(none)'}`);
                debugLines.push(`- Name matches: ${cantripIds.length}`);
                if (unresolvedNames.length) {
                    debugLines.push(`- Unmatched names: ${unresolvedNames.join(' | ')}`);
                } else {
                    debugLines.push('- Unmatched names: none');
                }
                debugLines.push(`- Final IDs: ${cantripIds.join('|') || '(none)'}`);
                debugLines.push(`- Row decision: ${hasRowData ? 'kept' : 'skipped (empty row)'}`);
                debugLines.push('');

                if (!hasRowData) {
                    return null;
                }

                return normalizeRow({
                    id: generateId(),
                    name: finalName,
                    eventNumber: row.EventNumber ?? row.eventNumber ?? '',
                    adventureNumber: row.AdventureNumber ?? row.adventureNumber ?? '',
                    school: row.School ?? row.school ?? '',
                    expiryDate: row.ExpiryDate ?? row.expiryDate ?? '',
                    adventure: row.Adventure ?? row.adventure ?? '',
                    cantripIds,
                    cantripNames
                });
            }).filter(Boolean);

            if (!mapped.length) {
                showImportDebug(debugLines);
                showStatus('No valid cantrip tomes found to import.');
                return;
            }

            rows = mapped;
            saveRows();
            renderRows();
            clearForm();
            showImportDebug(debugLines);
            showStatus(`Imported ${mapped.length} cantrip tomes.`);
        }

        newTomeBtn.addEventListener('click', () => {
            clearForm();
            showStatus('Ready to create a new Cantrip Tome.');
        });

        saveTomeBtn.addEventListener('click', () => saveFormRow(false));
        saveAndAddBtn.addEventListener('click', () => saveFormRow(true));

        clearFormBtn.addEventListener('click', () => {
            clearForm();
            showStatus('Form cleared.');
        });

        cancelEditBtn.addEventListener('click', () => {
            clearForm();
            showStatus('Edit cancelled.');
        });

        exportBtn.addEventListener('click', exportRegister);

        importBtn.addEventListener('click', () => {
            importInput.value = '';
            importInput.click();
        });

        importInput.addEventListener('change', async (event) => {
            const file = event.target.files && event.target.files[0] ? event.target.files[0] : null;
            if (!file) return;

            try {
                await importRegister(file);
            } catch (error) {
                console.error('Cantrip Register: import failed', error);
                showStatus('Could not import register file.');
            }
        });

        clearRegisterBtn.addEventListener('click', () => {
            if (!window.confirm('Clear all Cantrip Tome register entries?')) {
                return;
            }

            rows = [];
            saveRows();
            renderRows();
            clearForm();
            showStatus('Cantrip register cleared.');
        });

        adventureSelectEl.addEventListener('change', () => {
            if (!editingId) {
                const matchedNumber = getSelectedAdventureNumberFromLabel(adventureSelectEl.value);
                if (matchedNumber) {
                    adventureNumberEl.value = matchedNumber;
                }
            }
        });

        cantripSearchEl.addEventListener('input', () => {
            renderCantripOptions();
        });

        cantripListEl.addEventListener('change', (event) => {
            const target = event.target;
            if (!(target instanceof HTMLInputElement) || target.type !== 'checkbox') return;

            const id = String(target.value || '').trim();
            if (!id) return;

            if (target.checked) selectedCantripIds.add(id);
            else selectedCantripIds.delete(id);
        });

        sortableHeaderEls.forEach((headerEl) => {
            headerEl.addEventListener('click', () => {
                toggleSort(String(headerEl.dataset.sortKey || ''));
            });
        });

        loadRows();
        renderRows();
        clearForm();
        showStatus('Ready. Create or import Cantrip Tomes.');
    </script>
</body>
</html>
