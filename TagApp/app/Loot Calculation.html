<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="db-storage.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loot Calculation</title>
    <link rel="stylesheet" href="theme.css">
    <style>
        .container {
            max-width: 1100px;
        }

        .loot-calc {
            margin-top: 10px;
        }

        .loot-calc p {
            color: var(--app-muted);
            margin-bottom: 12px;
        }

        .top-controls {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: end;
            margin-bottom: 12px;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 6px;
            min-width: 180px;
        }

        .field label {
            color: var(--app-muted);
            font-weight: 600;
            font-size: 0.95rem;
        }

        .field select {
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid var(--app-border);
            background: #1f2937;
            color: var(--app-text);
            font-size: 0.95rem;
        }

        .field select:focus {
            outline: 2px solid #00bcd4;
            outline-offset: 1px;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 0;
            margin-bottom: 12px;
        }

        .modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(2, 6, 23, 0.75);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            z-index: 60;
        }

        .modal-backdrop.hidden {
            display: none;
        }

        .modal-panel {
            width: min(760px, 100%);
            max-height: 85vh;
            overflow: auto;
            border: 1px solid var(--app-border);
            border-radius: 12px;
            background: #0f172a;
            padding: 14px;
        }

        .modal-title {
            margin: 0 0 10px;
            font-size: 1.05rem;
            color: var(--app-text);
        }

        .factor-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 12px;
        }

        .factor-table th,
        .factor-table td {
            border-bottom: 1px solid var(--app-border);
            padding: 8px;
            text-align: left;
            font-size: 0.9rem;
        }

        .factor-table th {
            background: #111827;
            color: #d1d5db;
        }

        .factor-input {
            width: 120px;
            padding: 6px 8px;
            border: 1px solid var(--app-border);
            border-radius: 6px;
            background: #0b1220;
            color: var(--app-text);
            font-size: 0.9rem;
        }

        .factor-input:focus {
            outline: 2px solid #00bcd4;
            outline-offset: 1px;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        .btn {
            border: 0;
            border-radius: 8px;
            padding: 10px 14px;
            font-weight: 600;
            cursor: pointer;
            transition: filter 0.2s ease;
        }

        .btn:hover {
            filter: brightness(1.06);
        }

        .btn-secondary {
            background: #4a5568;
            color: #edf2f7;
        }

        .loot-table-wrap {
            overflow-x: auto;
            border: 1px solid var(--app-border);
            border-radius: 10px;
        }

        .loot-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 700px;
            background: #111827;
        }

        .loot-table th,
        .loot-table td {
            border-bottom: 1px solid var(--app-border);
            padding: 10px 12px;
            text-align: left;
            vertical-align: top;
            font-size: 0.93rem;
        }

        .loot-table th {
            background: #0f172a;
            color: #d1d5db;
            font-weight: 700;
            white-space: nowrap;
            position: sticky;
            top: 0;
            z-index: 5;
            box-shadow: 0 1px 0 var(--app-border);
        }

        .loot-table tbody tr:last-child td {
            border-bottom: 0;
        }

        .loot-row-total td:first-child {
            font-weight: 700;
        }

        .loot-level-1 td:first-child {
            border-left: 4px solid #60a5fa;
            padding-left: 10px;
        }

        .loot-level-2 td:first-child {
            border-left: 4px solid #a78bfa;
            padding-left: 10px;
        }

        .loot-level-4 td:first-child {
            border-left: 4px solid #34d399;
            padding-left: 10px;
        }

        .loot-level-1 td {
            background-color: rgba(96, 165, 250, 0.05);
        }

        .loot-level-2 td {
            background-color: rgba(167, 139, 250, 0.05);
        }

        .loot-level-4 td {
            background-color: rgba(52, 211, 153, 0.05);
        }

        .loot-number {
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
        }

        .remaining-cell {
            min-width: 180px;
        }

        .remaining-wrap {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .remaining-value {
            font-variant-numeric: tabular-nums;
        }

        .remaining-track {
            width: 100%;
            height: 8px;
            border-radius: 999px;
            overflow: hidden;
            background: #1f2937;
            border: 1px solid #334155;
        }

        .remaining-fill {
            display: block;
            height: 100%;
            width: 0%;
            transition: width 0.2s ease, background-color 0.2s ease;
            background: #22c55e;
        }

        .remaining-fill-low {
            background: #f59e0b;
        }

        .remaining-fill-empty {
            background: #ef4444;
        }

        .loot-col-max {
            background: rgba(34, 197, 94, 0.14);
        }

        .loot-col-mid {
            background: rgba(59, 130, 246, 0.14);
        }

        .loot-col-min {
            background: rgba(245, 158, 11, 0.16);
        }

        .loot-table.difficulty-hard .loot-col-max,
        .loot-table.difficulty-medium .loot-col-mid,
        .loot-table.difficulty-easy .loot-col-min {
            background: rgba(0, 188, 212, 0.28);
            box-shadow: inset 0 0 0 1px rgba(0, 188, 212, 0.45);
        }

        .loot-allocated-input {
            width: 100%;
            min-width: 120px;
            padding: 6px 8px;
            border-radius: 6px;
            border: 1px solid var(--app-border);
            background: #0b1220;
            color: var(--app-text);
            font-size: 0.9rem;
        }

        .loot-allocated-input:focus {
            outline: 2px solid #00bcd4;
            outline-offset: 1px;
        }

        .loot-clear-btn {
            border: 1px solid var(--app-border);
            background: #0f172a;
            color: var(--app-text);
            border-radius: 6px;
            padding: 5px 8px;
            font-size: 0.8rem;
            cursor: pointer;
            white-space: nowrap;
        }

        .loot-clear-btn:hover {
            filter: brightness(1.08);
        }

        .status {
            margin-top: 12px;
            color: var(--app-muted);
            min-height: 1.2em;
        }
    </style>
</head>
<body>
    <main class="container">
        <h1>Loot Calculation</h1>


        <section class="loot-calc" aria-labelledby="lootCalcHeading">
            <h2 id="lootCalcHeading">Loot Calc</h2>

            <div class="top-controls">
                <div class="field">
                    <label for="eventDifficulty">Event Difficulty</label>
                    <select id="eventDifficulty" name="eventDifficulty">
                        <option value="hard">Hard</option>
                        <option value="medium" selected>Medium</option>
                        <option value="easy">Easy</option>
                    </select>
                </div>
            </div>

            <div class="actions">
                <button id="editLootFormulaBtn" class="btn btn-secondary" type="button">Edit Formula Multipliers</button>
                <button id="editLootFactorsBtn" class="btn btn-secondary" type="button">Edit Item Multiplication Factors</button>
                <button id="clearNonGroupedAllocationsBtn" class="btn btn-secondary" type="button">Clear Non-grouped Allocations</button>
            </div>

            <div class="loot-table-wrap">
                <table id="lootCalcTable" class="loot-table" aria-label="Loot calculation results">
                    <thead>
                        <tr>
                            <th>Item Type</th>
                            <th class="loot-col-max">Hard</th>
                            <th class="loot-col-mid">Medium</th>
                            <th class="loot-col-min">Easy</th>
                            <th>Allocated Amount</th>
                            <th>Remaining Amount</th>
                        </tr>
                    </thead>
                    <tbody id="lootCalcBody"></tbody>
                </table>
            </div>
        </section>

        <div id="lootFactorModal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="lootFactorModalTitle">
            <div class="modal-panel">
                <h3 id="lootFactorModalTitle" class="modal-title">Edit Loot Multiplication Factors</h3>
                <table class="factor-table" aria-label="Loot multiplication factors">
                    <thead>
                        <tr>
                            <th>Item Type</th>
                            <th>Factor</th>
                        </tr>
                    </thead>
                    <tbody id="lootFactorBody"></tbody>
                </table>
                <div class="modal-actions">
                    <button id="cancelLootFactorsBtn" class="btn btn-secondary" type="button">Cancel</button>
                    <button id="saveLootFactorsBtn" class="btn btn-secondary" type="button">Save Factors</button>
                </div>
            </div>
        </div>

        <div id="lootFormulaModal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="lootFormulaModalTitle">
            <div class="modal-panel">
                <h3 id="lootFormulaModalTitle" class="modal-title">Edit Loot Formula Multipliers</h3>
                <table class="factor-table" aria-label="Loot formula multipliers">
                    <thead>
                        <tr>
                            <th>Formula Setting</th>
                            <th>Value</th>
                        </tr>
                    </thead>
                    <tbody id="lootFormulaBody"></tbody>
                </table>
                <div class="modal-actions">
                    <button id="cancelLootFormulaBtn" class="btn btn-secondary" type="button">Cancel</button>
                    <button id="saveLootFormulaBtn" class="btn btn-secondary" type="button">Save Formula</button>
                </div>
            </div>
        </div>

        <p id="statusMessage" class="status"></p>
    </main>

    <script src="event-variables.js"></script>
    <script>
        const eventVarsApi = window.EventVariables;
        const lootCalcBody = document.getElementById('lootCalcBody');
        const lootCalcTable = document.getElementById('lootCalcTable');
        const eventDifficultySelect = document.getElementById('eventDifficulty');
        const editLootFormulaBtn = document.getElementById('editLootFormulaBtn');
        const editLootFactorsBtn = document.getElementById('editLootFactorsBtn');
        const clearNonGroupedAllocationsBtn = document.getElementById('clearNonGroupedAllocationsBtn');
        const lootFactorModal = document.getElementById('lootFactorModal');
        const lootFactorBody = document.getElementById('lootFactorBody');
        const cancelLootFactorsBtn = document.getElementById('cancelLootFactorsBtn');
        const saveLootFactorsBtn = document.getElementById('saveLootFactorsBtn');
        const lootFormulaModal = document.getElementById('lootFormulaModal');
        const lootFormulaBody = document.getElementById('lootFormulaBody');
        const cancelLootFormulaBtn = document.getElementById('cancelLootFormulaBtn');
        const saveLootFormulaBtn = document.getElementById('saveLootFormulaBtn');
        const statusMessage = document.getElementById('statusMessage');

        const lootAllocationsStorageKey = 'lootCalcAllocated.v1';
        const lootFactorsStorageKey = 'lootCalcFactors.v1';
        const lootFormulaStorageKey = 'lootCalcFormula.v1';
        let lootAllocations = {};
        let lootFactors = {};
        const defaultLootFormula = {
            totalSilverMultiplier: 1.5,
            type2MagicDivisor: 25,
            type1MagicDivisor: 10,
            productionDivisor: 5,
            cantripDivisor: 50,
            level1Multiplier: 2,
            level2Divisor: 10,
            level4Divisor: 25
        };
        let lootFormula = { ...defaultLootFormula };
        const lootFormulaFields = [
            { key: 'totalSilverMultiplier', label: 'Total Silver Multiplier (totalBuild * x)' },
            { key: 'type2MagicDivisor', label: 'Type 2 Magic Divisor ((players * days) / x)' },
            { key: 'type1MagicDivisor', label: 'Type 1 Magic Divisor ((players * days) / x)' },
            { key: 'productionDivisor', label: 'Production Divisor ((totalBuild * days) / x)' },
            { key: 'cantripDivisor', label: 'Cantrip Pages Divisor ((totalBuild * days) / x)' },
            { key: 'level1Multiplier', label: 'Level 1 Multiplier (players * days * x)' },
            { key: 'level2Divisor', label: 'Level 2 Divisor ((players * days * level1Multiplier) / x)' },
            { key: 'level4Divisor', label: 'Level 4 Divisor ((players * days) / x)' }
        ];

        function showStatus(message) {
            statusMessage.textContent = message;
        }

        function toNumber(value) {
            const num = Number(value);
            return Number.isFinite(num) ? num : 0;
        }

        function floorInt(value) {
            return Math.floor(value);
        }

        function roundInt(value) {
            return Math.round(value);
        }

        function ceilInt(value) {
            return Math.ceil(value);
        }

        function computeMid(maxDrop, minimum) {
            return floorInt((maxDrop + minimum) / 2);
        }

        function formatInt(value) {
            return value.toLocaleString();
        }

        function clampPercent(value) {
            return Math.max(0, Math.min(100, value));
        }

        function getRemainingBarClass(percent) {
            if (percent <= 0) return 'remaining-fill remaining-fill-empty';
            if (percent < 30) return 'remaining-fill remaining-fill-low';
            return 'remaining-fill';
        }

        function normalizeFactor(value) {
            const parsed = Number(value);
            if (!Number.isFinite(parsed) || parsed <= 0) return 1;
            return parsed;
        }

        function normalizePositive(value, fallbackValue) {
            const parsed = Number(value);
            if (!Number.isFinite(parsed) || parsed <= 0) return fallbackValue;
            return parsed;
        }

        function createLootRow(label, maxDrop, minimum, options = {}) {
            const factor = normalizeFactor(options.factor);
            const scaledMaxDrop = roundInt(maxDrop * factor);
            const scaledMinimum = roundInt(minimum * factor);
            return {
                label,
                maxDrop: scaledMaxDrop,
                minimum: scaledMinimum,
                mid: computeMid(scaledMaxDrop, scaledMinimum),
                factor,
                isGroupTotal: Boolean(options.isGroupTotal),
                childLabels: Array.isArray(options.childLabels) ? options.childLabels : []
            };
        }

        function sumByLabels(labels, getValue) {
            return labels.reduce((sum, label) => sum + getValue(label), 0);
        }

        function loadLootAllocations() {
            try {
                const raw = localStorage.getItem(lootAllocationsStorageKey);
                lootAllocations = raw ? JSON.parse(raw) : {};
                if (!lootAllocations || typeof lootAllocations !== 'object') {
                    lootAllocations = {};
                }
            } catch (error) {
                console.error('Failed to load loot allocations:', error);
                lootAllocations = {};
            }
        }

        function saveLootAllocations() {
            try {
                localStorage.setItem(lootAllocationsStorageKey, JSON.stringify(lootAllocations));
            } catch (error) {
                console.error('Failed to save loot allocations:', error);
            }
        }

        function loadLootFactors() {
            try {
                const raw = localStorage.getItem(lootFactorsStorageKey);
                lootFactors = raw ? JSON.parse(raw) : {};
                if (!lootFactors || typeof lootFactors !== 'object') {
                    lootFactors = {};
                }
            } catch (error) {
                console.error('Failed to load loot factors:', error);
                lootFactors = {};
            }
        }

        function saveLootFactors() {
            try {
                localStorage.setItem(lootFactorsStorageKey, JSON.stringify(lootFactors));
            } catch (error) {
                console.error('Failed to save loot factors:', error);
            }
        }

        function getLootFactor(label) {
            return normalizeFactor(lootFactors[label]);
        }

        function loadLootFormula() {
            try {
                const raw = localStorage.getItem(lootFormulaStorageKey);
                const parsed = raw ? JSON.parse(raw) : {};

                lootFormula = {
                    totalSilverMultiplier: normalizePositive(parsed?.totalSilverMultiplier, defaultLootFormula.totalSilverMultiplier),
                    type2MagicDivisor: normalizePositive(parsed?.type2MagicDivisor, defaultLootFormula.type2MagicDivisor),
                    type1MagicDivisor: normalizePositive(parsed?.type1MagicDivisor, defaultLootFormula.type1MagicDivisor),
                    productionDivisor: normalizePositive(parsed?.productionDivisor, defaultLootFormula.productionDivisor),
                    cantripDivisor: normalizePositive(parsed?.cantripDivisor, defaultLootFormula.cantripDivisor),
                    level1Multiplier: normalizePositive(parsed?.level1Multiplier, defaultLootFormula.level1Multiplier),
                    level2Divisor: normalizePositive(parsed?.level2Divisor, defaultLootFormula.level2Divisor),
                    level4Divisor: normalizePositive(parsed?.level4Divisor, defaultLootFormula.level4Divisor)
                };
            } catch (error) {
                console.error('Failed to load loot formula settings:', error);
                lootFormula = { ...defaultLootFormula };
            }
        }

        function saveLootFormula() {
            try {
                localStorage.setItem(lootFormulaStorageKey, JSON.stringify(lootFormula));
            } catch (error) {
                console.error('Failed to save loot formula settings:', error);
            }
        }

        function buildLootRows() {
            const data = eventVarsApi?.get?.() || {};
            const totalEventBuild = toNumber(data.totalEventBuild);
            const players = toNumber(data.players);
            const eventDays = toNumber(data.eventDays);

            const totalSilver = ceilInt(totalEventBuild * lootFormula.totalSilverMultiplier);
            const type2MagicItems = floorInt((players * eventDays) / lootFormula.type2MagicDivisor);
            const type1MagicItems = ceilInt((players * eventDays) / lootFormula.type1MagicDivisor);
            const productionItems = ceilInt((totalEventBuild * eventDays) / lootFormula.productionDivisor);
            const cantripPages = roundInt((totalEventBuild * eventDays) / lootFormula.cantripDivisor);

            const totalLevel1 = ceilInt(players * eventDays * lootFormula.level1Multiplier);
            const p1 = roundInt(totalLevel1 * 0.45);
            const c1 = roundInt(totalLevel1 * 0.1);
            const e1 = roundInt(totalLevel1 * 0.1);
            const s1 = roundInt(totalLevel1 * 0.1);
            const sr1 = roundInt(totalLevel1 * 0.1);
            const v1 = roundInt(totalLevel1 * 0.05);
            const t1 = roundInt(totalLevel1 * 0.05);
            const d1 = roundInt(totalLevel1 * 0.05);

            const totalLevel2 = ceilInt((players * eventDays * lootFormula.level1Multiplier) / lootFormula.level2Divisor);
            const p2 = roundInt(totalLevel2 * 0.4);
            const c2 = roundInt(totalLevel2 * 0.15);
            const e2 = roundInt(totalLevel2 * 0.15);
            const s2 = roundInt(totalLevel2 * 0.15);
            const v2 = roundInt(totalLevel2 * 0.05);
            const t2 = roundInt(totalLevel2 * 0.05);
            const d2 = roundInt(totalLevel2 * 0.05);

            const totalLevel4 = roundInt((players * eventDays) / lootFormula.level4Divisor);
            const p4 = roundInt(totalLevel4 * 0.4);
            const c4 = roundInt(totalLevel4 * 0.15);
            const e4 = roundInt(totalLevel4 * 0.15);
            const s4 = roundInt(totalLevel4 * 0.15);
            const v4 = roundInt(totalLevel4 * 0.05);
            const t4 = roundInt(totalLevel4 * 0.05);
            const d4 = roundInt(totalLevel4 * 0.05);

            return [
                createLootRow('Total Silver', totalSilver, totalSilver, { factor: getLootFactor('Total Silver') }),
                createLootRow('Type 2 Magic Items', type2MagicItems, floorInt(type2MagicItems / 2), { factor: getLootFactor('Type 2 Magic Items') }),
                createLootRow('Type 1 Magic Items', type1MagicItems, floorInt(type1MagicItems / 2), { factor: getLootFactor('Type 1 Magic Items') }),
                createLootRow('Production Items', productionItems, floorInt(productionItems / 2), { factor: getLootFactor('Production Items') }),
                createLootRow('Cantrip Pages', cantripPages, floorInt(cantripPages / 2), { factor: getLootFactor('Cantrip Pages') }),
                createLootRow('Total Level 1 Formal Components', totalLevel1, floorInt(totalLevel1 / 2), {
                    factor: getLootFactor('Total Level 1 Formal Components'),
                    isGroupTotal: true,
                    childLabels: ['P1', 'C1', 'E1', 'S1', 'SR1', 'V1', 'T1', 'D1']
                }),
                createLootRow('P1', p1, floorInt(p1 / 3), { factor: getLootFactor('P1') }),
                createLootRow('C1', c1, floorInt(c1 / 3), { factor: getLootFactor('C1') }),
                createLootRow('E1', e1, floorInt(e1 / 3), { factor: getLootFactor('E1') }),
                createLootRow('S1', s1, floorInt(s1 / 3), { factor: getLootFactor('S1') }),
                createLootRow('SR1', sr1, floorInt(sr1 / 3), { factor: getLootFactor('SR1') }),
                createLootRow('V1', v1, floorInt(v1 / 3), { factor: getLootFactor('V1') }),
                createLootRow('T1', t1, floorInt(t1 / 3), { factor: getLootFactor('T1') }),
                createLootRow('D1', d1, floorInt(d1 / 3), { factor: getLootFactor('D1') }),
                createLootRow('Total Level 2 Formal Components', totalLevel2, floorInt(totalLevel2 / 2), {
                    factor: getLootFactor('Total Level 2 Formal Components'),
                    isGroupTotal: true,
                    childLabels: ['P2', 'C2', 'E2', 'S2', 'V2', 'T2', 'D2']
                }),
                createLootRow('P2', p2, floorInt(p2 / 3), { factor: getLootFactor('P2') }),
                createLootRow('C2', c2, floorInt(c2 / 3), { factor: getLootFactor('C2') }),
                createLootRow('E2', e2, floorInt(e2 / 3), { factor: getLootFactor('E2') }),
                createLootRow('S2', s2, floorInt(s2 / 3), { factor: getLootFactor('S2') }),
                createLootRow('V2', v2, floorInt(v2 / 3), { factor: getLootFactor('V2') }),
                createLootRow('T2', t2, floorInt(t2 / 3), { factor: getLootFactor('T2') }),
                createLootRow('D2', d2, floorInt(d2 / 3), { factor: getLootFactor('D2') }),
                createLootRow('Total Level 4 Formal Components', totalLevel4, floorInt(totalLevel4 / 2), {
                    factor: getLootFactor('Total Level 4 Formal Components'),
                    isGroupTotal: true,
                    childLabels: ['P4', 'C4', 'E4', 'S4', 'V4', 'T4', 'D4']
                }),
                createLootRow('P4', p4, floorInt(p4 / 3), { factor: getLootFactor('P4') }),
                createLootRow('C4', c4, floorInt(c4 / 3), { factor: getLootFactor('C4') }),
                createLootRow('E4', e4, floorInt(e4 / 3), { factor: getLootFactor('E4') }),
                createLootRow('S4', s4, floorInt(s4 / 3), { factor: getLootFactor('S4') }),
                createLootRow('V4', v4, floorInt(v4 / 3), { factor: getLootFactor('V4') }),
                createLootRow('T4', t4, floorInt(t4 / 3), { factor: getLootFactor('T4') }),
                createLootRow('D4', d4, floorInt(d4 / 3), { factor: getLootFactor('D4') })
            ];
        }

        function buildFactorEditableRows() {
            return buildLootRows().filter((row) => !row.isGroupTotal);
        }

        function openLootFactorModal() {
            lootFactorBody.innerHTML = '';

            const rows = buildFactorEditableRows();
            for (const row of rows) {
                const tr = document.createElement('tr');

                const labelTd = document.createElement('td');
                labelTd.textContent = row.label;
                tr.appendChild(labelTd);

                const factorTd = document.createElement('td');
                const input = document.createElement('input');
                input.type = 'number';
                input.className = 'factor-input';
                input.min = '0.01';
                input.step = '0.01';
                input.value = String(getLootFactor(row.label));
                input.dataset.label = row.label;
                input.setAttribute('aria-label', `Multiplier factor for ${row.label}`);
                factorTd.appendChild(input);
                tr.appendChild(factorTd);

                lootFactorBody.appendChild(tr);
            }

            lootFactorModal.classList.remove('hidden');
        }

        function closeLootFactorModal() {
            lootFactorModal.classList.add('hidden');
        }

        function saveLootFactorModal() {
            const inputs = lootFactorBody.querySelectorAll('.factor-input');
            const nextFactors = {};

            inputs.forEach((input) => {
                const label = String(input.dataset.label || '').trim();
                if (!label) return;

                const factor = normalizeFactor(input.value);
                if (Math.abs(factor - 1) > 0.000001) {
                    nextFactors[label] = factor;
                }
            });

            lootFactors = nextFactors;
            saveLootFactors();
            closeLootFactorModal();
            renderLootCalc();
            showStatus('Loot multiplication factors saved.');
        }

        function openLootFormulaModal() {
            lootFormulaBody.innerHTML = '';

            lootFormulaFields.forEach((field) => {
                const tr = document.createElement('tr');

                const labelTd = document.createElement('td');
                labelTd.textContent = field.label;
                tr.appendChild(labelTd);

                const valueTd = document.createElement('td');
                const input = document.createElement('input');
                input.type = 'number';
                input.className = 'factor-input';
                input.min = '0.01';
                input.step = '0.01';
                input.dataset.key = field.key;
                input.value = String(normalizePositive(lootFormula[field.key], defaultLootFormula[field.key]));
                input.setAttribute('aria-label', field.label);
                valueTd.appendChild(input);
                tr.appendChild(valueTd);

                lootFormulaBody.appendChild(tr);
            });

            lootFormulaModal.classList.remove('hidden');
        }

        function closeLootFormulaModal() {
            lootFormulaModal.classList.add('hidden');
        }

        function saveLootFormulaModal() {
            const inputs = lootFormulaBody.querySelectorAll('input[data-key]');
            const nextFormula = { ...defaultLootFormula };

            inputs.forEach((input) => {
                const key = String(input.dataset.key || '').trim();
                if (!Object.prototype.hasOwnProperty.call(defaultLootFormula, key)) return;
                nextFormula[key] = normalizePositive(input.value, defaultLootFormula[key]);
            });

            lootFormula = nextFormula;
            saveLootFormula();
            closeLootFormulaModal();
            renderLootCalc();
            showStatus('Loot formula multipliers updated.');
        }

        function getSelectedDifficulty() {
            const difficulty = String(eventDifficultySelect.value || 'medium').toLowerCase();
            if (difficulty === 'easy' || difficulty === 'medium' || difficulty === 'hard') {
                return difficulty;
            }
            return 'medium';
        }

        function getSelectedValueForRow(row, difficulty) {
            if (difficulty === 'hard') return row.maxDrop;
            if (difficulty === 'easy') return row.minimum;
            return row.mid;
        }

        function applyDifficultyHighlight(difficulty) {
            lootCalcTable.classList.remove('difficulty-hard', 'difficulty-medium', 'difficulty-easy');
            lootCalcTable.classList.add(`difficulty-${difficulty}`);
        }

        function getComponentLevel(row) {
            const label = String(row.label || '').trim();
            if (label.endsWith('1') || label.includes('Level 1')) return '1';
            if (label.endsWith('2') || label.includes('Level 2')) return '2';
            if (label.endsWith('4') || label.includes('Level 4')) return '4';
            return '';
        }

        function renderLootCalc() {
            const rows = buildLootRows();
            const selectedDifficulty = getSelectedDifficulty();
            lootCalcBody.innerHTML = '';
            applyDifficultyHighlight(selectedDifficulty);

            for (const row of rows) {
                const tr = document.createElement('tr');
                const componentLevel = getComponentLevel(row);

                if (componentLevel) tr.classList.add(`loot-level-${componentLevel}`);
                if (row.isGroupTotal) tr.classList.add('loot-row-total');

                const labelTd = document.createElement('td');
                labelTd.textContent = row.label;
                tr.appendChild(labelTd);

                const maxTd = document.createElement('td');
                maxTd.className = 'loot-number loot-col-max';
                maxTd.textContent = formatInt(row.maxDrop);
                tr.appendChild(maxTd);

                const midTd = document.createElement('td');
                midTd.className = 'loot-number loot-col-mid';
                midTd.textContent = formatInt(row.mid);
                tr.appendChild(midTd);

                const minTd = document.createElement('td');
                minTd.className = 'loot-number loot-col-min';
                minTd.textContent = formatInt(row.minimum);
                tr.appendChild(minTd);

                const allocatedTd = document.createElement('td');
                let allocatedValue = 0;

                if (row.isGroupTotal) {
                    allocatedValue = sumByLabels(row.childLabels, (label) => toNumber(lootAllocations[label]));
                    allocatedTd.className = 'loot-number';

                    const groupWrap = document.createElement('div');
                    groupWrap.style.display = 'flex';
                    groupWrap.style.alignItems = 'center';
                    groupWrap.style.justifyContent = 'space-between';
                    groupWrap.style.gap = '8px';

                    const allocatedText = document.createElement('span');
                    allocatedText.textContent = formatInt(allocatedValue);
                    groupWrap.appendChild(allocatedText);

                    if (row.childLabels.length > 0) {
                        const clearBtn = document.createElement('button');
                        clearBtn.type = 'button';
                        clearBtn.className = 'loot-clear-btn';
                        clearBtn.textContent = 'Clear Allocations';
                        clearBtn.setAttribute('aria-label', `Clear allocations for ${row.label}`);
                        clearBtn.addEventListener('click', () => {
                            for (const childLabel of row.childLabels) {
                                delete lootAllocations[childLabel];
                            }
                            saveLootAllocations();
                            renderLootCalc();
                        });
                        groupWrap.appendChild(clearBtn);
                    }

                    allocatedTd.appendChild(groupWrap);
                } else {
                    const allocatedInput = document.createElement('input');
                    allocatedInput.className = 'loot-allocated-input';
                    allocatedInput.type = 'number';
                    allocatedInput.min = '0';
                    allocatedInput.step = '1';
                    allocatedInput.placeholder = '0';
                    allocatedInput.value = lootAllocations[row.label] ?? '';
                    allocatedInput.setAttribute('aria-label', `Allocated amount for ${row.label}`);

                    const persistAllocation = () => {
                        const value = allocatedInput.value.trim();
                        if (!value) {
                            delete lootAllocations[row.label];
                        } else {
                            lootAllocations[row.label] = value;
                        }
                        saveLootAllocations();
                    };

                    // Save while typing, but do not rerender the full table on each keypress.
                    allocatedInput.addEventListener('input', () => {
                        persistAllocation();
                    });

                    // Recompute totals/remaining once editing is committed.
                    allocatedInput.addEventListener('change', () => {
                        persistAllocation();
                        renderLootCalc();
                    });

                    allocatedTd.appendChild(allocatedInput);
                    allocatedValue = toNumber(lootAllocations[row.label]);
                }

                tr.appendChild(allocatedTd);

                const selectedValue = getSelectedValueForRow(row, selectedDifficulty);
                const remainingValue = selectedValue - allocatedValue;

                const remainingTd = document.createElement('td');
                remainingTd.className = 'remaining-cell';

                const remainingWrap = document.createElement('div');
                remainingWrap.className = 'remaining-wrap';

                const remainingText = document.createElement('span');
                remainingText.className = 'remaining-value';
                remainingText.textContent = formatInt(remainingValue);
                remainingWrap.appendChild(remainingText);

                const remainingTrack = document.createElement('div');
                remainingTrack.className = 'remaining-track';

                const remainingFill = document.createElement('span');
                const remainingPercent = selectedValue > 0 ? (remainingValue / selectedValue) * 100 : 0;
                const clampedPercent = clampPercent(remainingPercent);
                remainingFill.className = getRemainingBarClass(clampedPercent);
                remainingFill.style.width = `${clampedPercent}%`;
                remainingFill.title = `${Math.round(clampedPercent)}% remaining`;
                remainingTrack.appendChild(remainingFill);

                remainingWrap.appendChild(remainingTrack);
                remainingTd.appendChild(remainingWrap);
                tr.appendChild(remainingTd);

                lootCalcBody.appendChild(tr);
            }
        }

        function clearNonGroupedAllocations() {
            const rows = buildLootRows();
            const groupedChildLabels = new Set(
                rows
                    .filter((row) => row.isGroupTotal)
                    .flatMap((row) => row.childLabels || [])
            );

            const nonGroupedLabels = rows
                .filter((row) => !row.isGroupTotal && !groupedChildLabels.has(row.label))
                .map((row) => row.label);

            for (const label of nonGroupedLabels) {
                delete lootAllocations[label];
            }

            saveLootAllocations();
            renderLootCalc();
            showStatus('Non-grouped allocations cleared.');
        }

        function syncDifficultyFromEventVariables() {
            const data = eventVarsApi?.get?.() || {};
            const diff = String(data.eventDifficulty || 'medium').toLowerCase();
            if (diff === 'easy' || diff === 'medium' || diff === 'hard') {
                eventDifficultySelect.value = diff;
                return;
            }

            eventDifficultySelect.value = 'medium';
        }

        eventDifficultySelect.addEventListener('change', () => {
            eventVarsApi?.set?.({ eventDifficulty: eventDifficultySelect.value });
            renderLootCalc();
        });

        editLootFormulaBtn.addEventListener('click', openLootFormulaModal);
        cancelLootFormulaBtn.addEventListener('click', closeLootFormulaModal);
        saveLootFormulaBtn.addEventListener('click', saveLootFormulaModal);

        editLootFactorsBtn.addEventListener('click', openLootFactorModal);
        cancelLootFactorsBtn.addEventListener('click', closeLootFactorModal);
        saveLootFactorsBtn.addEventListener('click', saveLootFactorModal);

        clearNonGroupedAllocationsBtn.addEventListener('click', clearNonGroupedAllocations);

        eventVarsApi?.onChange?.(() => {
            syncDifficultyFromEventVariables();
            renderLootCalc();
        });

        loadLootAllocations();
        loadLootFactors();
        loadLootFormula();
        syncDifficultyFromEventVariables();
        renderLootCalc();
    </script>
</body>
</html>
