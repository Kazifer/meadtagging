<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Variables</title>
    <link rel="stylesheet" href="theme.css">
    <style>
        .container { max-width: 900px; }
        .event-form { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
        .field { display: flex; flex-direction: column; gap: 6px; }
        .field label { color: var(--app-muted); font-weight: 600; font-size: 0.95rem; }
        .field input, .field select { padding: 10px 12px; border-radius: 8px; border: 1px solid var(--app-border); background: #1f2937; color: var(--app-text); font-size: 0.95rem; }
        .field input:focus, .field select:focus { outline: 2px solid #00bcd4; outline-offset: 1px; }
        .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; }
        .btn {
            border: 0;
            border-radius: 8px;
            padding: 10px 14px;
            font-weight: 600;
            cursor: pointer;
            transition: filter 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            line-height: 1.2;
            appearance: none;
              
        }
        .btn:hover { filter: brightness(1.06); }
        .btn-primary { background: #00bcd4; color: #0f172a; }
        .btn-secondary { background: #4a5568; color: #edf2f7; }
        .status { margin-top: 20px; color:#4a5568; min-height: 1.0em; font-style: italic; }
        .hint { margin-top: 8px; font-size: 0.92rem; }

    </style>
</head>
<body>
    <main class="container">
        <h1>Event Variables</h1>
        <p>Set your event-level values once (used for remaining page calculations)</p>

        <form id="eventVariablesForm" class="event-form" autocomplete="off">
            <div class="field">
                <label for="eventName">Event Name</label>
                <input id="eventName" name="eventName" type="text" placeholder="e.g. Hoping for Summer" />
            </div>
            <div class="field">
                <label for="eventNumber">Event Number</label>
                <input id="eventNumber" name="eventNumber" type="number" min="0" step="1" placeholder="e.g. 10" />
            </div>
            <div class="field">
                <label for="totalEventBuild">Total Event Build</label>
                <input id="totalEventBuild" name="totalEventBuild" type="number" min="0" step="1" placeholder="e.g. 400" />
            </div>
            <div class="field">
                <label for="players">Players</label>
                <input id="players" name="players" type="number" min="0" step="1" placeholder="e.g. 85" />
            </div>
            <div class="field">
                <label for="eventDays">Event Days</label>
                <input id="eventDays" name="eventDays" type="number" min="0" step="1" placeholder="e.g. 3" />
            </div>
            <div class="field">
                <label for="totalAdventures">Total Adventures</label>
                <input id="totalAdventures" name="totalAdventures" type="number" min="0" step="1" placeholder="e.g. 58" />
            </div>
            <div class="field">
                <label for="eventDifficulty">Event Difficulty</label>
                <select id="eventDifficulty" name="eventDifficulty">
                    <option value="hard">Hard</option>
                    <option value="medium" selected>Medium</option>
                    <option value="easy">Easy</option>
                </select>
            </div>
            <div class="field">
                <label for="playersPerAdventure">Players Per Adventure</label>
                <input id="playersPerAdventure" name="playersPerAdventure" type="number" min="0" step="1" placeholder="e.g. 6" />
            </div>
        </form>

        <div class="actions">
            <button id="saveBtn" class="btn btn-primary" type="button">Save</button>
            <button id="resetBtn" class="btn btn-secondary" type="button">Clear Saved Values</button>
        </div>
  
        <p id="statusMessage" class="status"></p>

    </main>

    <script src="event-variables.js"></script>
    <script>
        const eventVarsApi = window.EventVariables;
        const form = document.getElementById('eventVariablesForm');
        const saveBtn = document.getElementById('saveBtn');
        const resetBtn = document.getElementById('resetBtn');
        const statusMessage = document.getElementById('statusMessage');

        function showStatus(message) {
            statusMessage.textContent = message;
        }

        function getFormData() {
            return {
                eventName: form.eventName.value.trim(),
                eventNumber: form.eventNumber.value,
                totalEventBuild: form.totalEventBuild.value,
                players: form.players.value,
                eventDays: form.eventDays.value,
                totalAdventures: form.totalAdventures.value,
                eventDifficulty: form.eventDifficulty.value,
                playersPerAdventure: form.playersPerAdventure.value
            };
        }

        function setFormData(data) {
            form.eventName.value = data.eventName || '';
            form.eventNumber.value = data.eventNumber || '';
            form.totalEventBuild.value = data.totalEventBuild || '';
            form.players.value = data.players || '';
            form.eventDays.value = data.eventDays || '';
            form.totalAdventures.value = data.totalAdventures || '';
            form.eventDifficulty.value = data.eventDifficulty || 'medium';
            form.playersPerAdventure.value = data.playersPerAdventure || '';
        }

        function saveValues() {
            try {
                eventVarsApi?.set(getFormData());
                showStatus('Saved.');
            } catch (error) {
                console.error('Failed to save event variables:', error);
                showStatus('Could not save values in this browser.');
            }
        }

        function loadValues() {
            try {
                const data = eventVarsApi?.get?.();
                const hasValues = data && Object.keys(data).some((key) => key !== 'updatedAt' && data[key]);
                if (!hasValues) {
                    showStatus('No saved values yet.');
                    return;
                }
                setFormData(data);
                showStatus('Saved values loaded.');
            } catch (error) {
                console.error('Failed to load event variables:', error);
                showStatus('Could not load saved values.');
            }
        }

        function clearValues() {
            try {
                eventVarsApi?.clear?.();
                form.reset();
                form.eventDifficulty.value = 'medium';
                showStatus('Saved values cleared.');
            } catch (error) {
                console.error('Failed to clear event variables:', error);
                showStatus('Could not clear saved values.');
            }
        }

        saveBtn.addEventListener('click', saveValues);
        resetBtn.addEventListener('click', clearValues);
        form.addEventListener('input', saveValues);
        form.addEventListener('change', saveValues);

        loadValues();
    </script>
</body>
</html>
