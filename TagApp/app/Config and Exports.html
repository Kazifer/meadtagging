<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Config and Exports</title>
    <link rel="stylesheet" href="theme.css">
    <style>
        .container { max-width: 980px; }
        .io-table-wrap { margin-top: 12px; border: 1px solid var(--app-border); border-radius: 10px; overflow: auto; background: #111827; }
        .io-table { width: 100%; border-collapse: collapse; min-width: 640px; }
        .io-table th, .io-table td { padding: 10px 12px; border-bottom: 1px solid var(--app-border); text-align: left; vertical-align: middle; }
        .io-table th { background: #0f172a; color: #d1d5db; font-weight: 700; white-space: nowrap; }
        .io-table tbody tr:last-child td { border-bottom: 0; }
        .io-table td:nth-child(2), .io-table td:nth-child(3) { width: 30%; }
        .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
        .btn { border: 0; border-radius: 8px; padding: 10px 14px; font-weight: 600; cursor: pointer; transition: filter 0.2s ease; }
        .btn:hover { filter: brightness(1.06); }
        .btn-primary { background: #00bcd4; color: #0f172a; }
        .btn-secondary { background: #4a5568; color: #edf2f7; }
        .status { margin-top: 12px; color: var(--app-muted); min-height: 1.2em; }
        .debug-panel { margin-top: 12px; border: 1px dashed var(--app-border); border-radius: 8px; padding: 8px; background: #0b1220; }
        .debug-panel summary { cursor: pointer; color: #cbd5e1; font-weight: 600; }
        .debug-output { margin-top: 8px; white-space: pre-wrap; font-size: 0.82rem; color: #94a3b8; max-height: 220px; overflow: auto; }
        .hint { margin-top: 8px; font-size: 0.92rem; }
    </style>
</head>
<body>
    <main class="container">
        <h1>Config and Exports</h1>
        <p>Import and export all workbook data from one place.</p>

        <div class="io-table-wrap">
            <table class="io-table" aria-label="Import and export options">
                <thead>
                    <tr>
                        <th>Event</th>
                        <th></th>
                        <th></th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>Event Variables</td>
                        <td><button id="exportEventVarsBtn" class="btn btn-secondary" type="button">Export (.xlsx)</button></td>
                        <td><button id="importEventVarsBtn" class="btn btn-secondary" type="button">Import (.xlsx)</button></td>
                    </tr>
                    <tr>
                        <td>Loot Calculation</td>
                        <td><button id="exportLootCalcBtn" class="btn btn-secondary" type="button">Export (.xlsx)</button></td>
                        <td><button id="importLootCalcBtn" class="btn btn-secondary" type="button">Import (.xlsx)</button></td>
                    </tr>
                    
                    <tr>
                        <td>Template Builds</td>
                        <td><button id="exportTemplatesBtn" class="btn btn-secondary" type="button">Export (.xlsx)</button></td>
                        <td><button id="importTemplatesBtn" class="btn btn-secondary" type="button">Import (.xlsx)</button></td>
                    </tr>
                    <tr>
                        <td>Feedback Sheet</td>
                        <td><button id="exportFeedbackSheetBtn" class="btn btn-secondary" type="button">Export (.xlsx)</button></td>
                        <td>-</td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div class="io-table-wrap">
            <table class="io-table" aria-label="Import and export options">
                <thead>
                    <tr>
                        <th>Adventures</th>
                        <th></th>
                        <th></th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>Adventure Listing</td>
                        <td><button id="exportAdventureListingBtn" class="btn btn-secondary" type="button">Export (.xlsx)</button></td>
                        <td><button id="importAdventureListingBtn" class="btn btn-secondary" type="button">Import (.xlsx)</button></td>
                    </tr>
                    <tr>
                        <td>Adventure Levelling</td>
                        <td><button id="exportAdventureLevellingBtn" class="btn btn-secondary" type="button">Export (.xlsx)</button></td>
                        <td><button id="importAdventureLevellingBtn" class="btn btn-secondary" type="button">Import (.xlsx)</button></td>
                    </tr>
                    <tr>
                        <td>Adventure Special Requirements</td>
                        <td><button id="exportAdventureSpecialReqsBtn" class="btn btn-secondary" type="button">Export (.xlsx)</button></td>
                        <td><button id="importAdventureSpecialReqsBtn" class="btn btn-secondary" type="button">Import (.xlsx)</button></td>
                    </tr>
              </tbody>
            </table>
        </div>
        <div class="actions">
            <button id="exportAllBtn" class="btn btn-primary" type="button">Export All (.xlsx)</button>
        </div>

        <details class="debug-panel">
            <summary>Import / Export Debug Info</summary>
            <pre id="importDebugOutput" class="debug-output">No import or export debug output yet.</pre>
        </details>

        <p id="statusMessage" class="status"></p>

    </main>

    <script src="event-variables.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script>
        const eventVarsApi = window.EventVariables;
        const adventureStorageKey = 'adventureLevelling.v1';
        const lootAllocationsStorageKey = 'lootCalcAllocated.v1';
        const scheduleStorageKey = 'adventureScheduling.v1';
        const templateBuildLogStorageKey = 'templateBuilder.eventLog.v1';

        const exportEventVarsBtn = document.getElementById('exportEventVarsBtn');
        const exportLootCalcBtn = document.getElementById('exportLootCalcBtn');
        const exportAdventureListingBtn = document.getElementById('exportAdventureListingBtn');
        const exportAdventureLevellingBtn = document.getElementById('exportAdventureLevellingBtn');
        const exportAdventureSpecialReqsBtn = document.getElementById('exportAdventureSpecialReqsBtn');
        const exportTemplatesBtn = document.getElementById('exportTemplatesBtn');
        const exportFeedbackSheetBtn = document.getElementById('exportFeedbackSheetBtn');
        const exportAllBtn = document.getElementById('exportAllBtn');
        const importEventVarsBtn = document.getElementById('importEventVarsBtn');
        const importLootCalcBtn = document.getElementById('importLootCalcBtn');
        const importAdventureListingBtn = document.getElementById('importAdventureListingBtn');
        const importAdventureLevellingBtn = document.getElementById('importAdventureLevellingBtn');
        const importAdventureSpecialReqsBtn = document.getElementById('importAdventureSpecialReqsBtn');
        const importTemplatesBtn = document.getElementById('importTemplatesBtn');
        const statusMessage = document.getElementById('statusMessage');
        const importDebugOutput = document.getElementById('importDebugOutput');

        function showStatus(message) { statusMessage.textContent = message; }
        function setDebugOutput(lines) {
            const output = Array.isArray(lines) && lines.length
                ? lines.join('\n')
                : 'No import or export debug output yet.';
            importDebugOutput.textContent = output;
        }
        function showImportDebug(lines) { setDebugOutput(lines); }
        function showExportDebug(lines) { setDebugOutput(lines); }
        function parseNumber(value) { const parsed = Number(value); return Number.isFinite(parsed) ? parsed : 0; }
        function parseAdventureCount(value) { const parsed = Number(value); if (!Number.isFinite(parsed)) return 0; return Math.max(0, Math.floor(parsed)); }
        function normalizeEventLevel(value) { const level = String(value || '').trim().toLowerCase(); if (level === 'min' || level === 'easy') return 'easy'; if (level === 'max' || level === 'hard') return 'hard'; return 'medium'; }
        function titleCaseLevel(value) { const level = normalizeEventLevel(value); if (level === 'easy') return 'Easy'; if (level === 'hard') return 'Hard'; return 'Medium'; }
        function safeFilePart(value) { return String(value || '').trim().replace(/[^a-z0-9-_ ]/gi, '').replace(/\s+/g, '_').replace(/_+/g, '_').replace(/^_+|_+$/g, '') || 'Event'; }
        function formatNumber(value) { const rounded = Math.round((value || 0) * 100) / 100; return Number.isFinite(rounded) ? rounded : 0; }
        function toYesNoBoolean(value) { const normalized = String(value || '').trim().toLowerCase(); return normalized === 'yes' || normalized === 'true' || normalized === '1'; }
        function normalizeMultilineText(value) { return String(value ?? '').replace(/\r\n/g, '\n').replace(/\r/g, '\n'); }

        function readStoredAdventureRows() {
            try {
                const raw = localStorage.getItem(adventureStorageKey);
                const parsed = raw ? JSON.parse(raw) : { rows: [] };
                return Array.isArray(parsed?.rows) ? parsed.rows : [];
            } catch (error) {
                console.error('Failed to read adventure rows:', error);
                return [];
            }
        }

        function readLootAllocations() {
            try {
                const raw = localStorage.getItem(lootAllocationsStorageKey);
                const parsed = raw ? JSON.parse(raw) : {};
                return parsed && typeof parsed === 'object' ? parsed : {};
            } catch (error) {
                console.error('Failed to read loot allocations:', error);
                return {};
            }
        }

        function readScheduleSlots() {
            try {
                const raw = localStorage.getItem(scheduleStorageKey);
                const parsed = raw ? JSON.parse(raw) : { slots: [] };
                const slots = Array.isArray(parsed?.slots) ? parsed.slots : [];
                return slots.map((slot) => {
                    if (Array.isArray(slot)) return slot.filter((value) => typeof value === 'string');
                    if (typeof slot === 'string' && slot.trim()) return [slot.trim()];
                    return [];
                });
            } catch (error) {
                console.error('Failed to read schedule slots:', error);
                return [];
            }
        }

        function makeAdventureKey(row, index) {
            const no = String(row?.no || '').trim();
            const title = String(row?.title || '').trim();
            return `${no}|${title}|${index}`;
        }

        function computePerAplRatios(vars) {
            const totalBuild = Math.max(0, parseNumber(vars.totalEventBuild));
            const players = Math.max(0, parseNumber(vars.players));
            const eventDays = Math.max(0, parseNumber(vars.eventDays));
            const totalAdventures = parseAdventureCount(vars.totalAdventures);
            const playersPerAdventure = Math.max(0, parseNumber(vars.playersPerAdventure));
            const eventLevel = normalizeEventLevel(vars.eventDifficulty || 'medium');

            const averageBuild = players > 0 ? (totalBuild / players) : 0;
            const averageLevel = Math.floor((averageBuild / 10) - 4);
            const levelsPerAdventure = averageLevel * playersPerAdventure;
            const totalEventAplEasy = levelsPerAdventure * totalAdventures;
            const totalEventAplMedium = totalEventAplEasy * 1.2;
            const totalEventAplHard = totalEventAplEasy * 1.5;

            let selectedTotalGoal = totalEventAplMedium;
            if (eventLevel === 'hard') selectedTotalGoal = totalEventAplHard;
            else if (eventLevel === 'easy') selectedTotalGoal = totalEventAplEasy;

            const totalSilver = Math.ceil(totalBuild * 1.5);
            const silverPerApl = selectedTotalGoal > 0 ? (totalSilver / selectedTotalGoal) : 0;

            const productionMax = Math.ceil((totalBuild * eventDays) / 5);
            const productionMin = Math.floor(productionMax / 2);
            const productionMid = Math.floor((productionMax + productionMin) / 2);
            let selectedProductionGoal = productionMid;
            if (eventLevel === 'hard') selectedProductionGoal = productionMax;
            else if (eventLevel === 'easy') selectedProductionGoal = productionMin;
            const productionPerApl = selectedTotalGoal > 0 ? (selectedProductionGoal / selectedTotalGoal) : 0;

            return { eventLevel, selectedTotalGoal, silverPerApl, productionPerApl, totalEventAplEasy, totalEventAplMedium, totalEventAplHard };
        }

        function computeTargetAplByDifficulty(rows, selectedTotalGoal) {
            const counts = { easy: 0, medium: 0, hard: 0 };
            rows.forEach((row) => {
                const difficulty = String(row?.difficulty || '').trim().toLowerCase();
                if (difficulty === 'easy' || difficulty === 'medium' || difficulty === 'hard') counts[difficulty] += 1;
            });
            const easyScore = counts.easy * 1;
            const mediumScore = counts.medium * 2;
            const hardScore = counts.hard * 3;
            const totalScore = easyScore + mediumScore + hardScore;
            const easyGoal = totalScore > 0 ? (selectedTotalGoal * easyScore / totalScore) : 0;
            const mediumGoal = totalScore > 0 ? (selectedTotalGoal * mediumScore / totalScore) : 0;
            const hardGoal = totalScore > 0 ? (selectedTotalGoal * hardScore / totalScore) : 0;
            return {
                easy: counts.easy > 0 ? (easyGoal / counts.easy) : 0,
                medium: counts.medium > 0 ? (mediumGoal / counts.medium) : 0,
                hard: counts.hard > 0 ? (hardGoal / counts.hard) : 0
            };
        }

        function getTargetAplForRow(row, targets) {
            const difficulty = String(row?.difficulty || '').trim().toLowerCase();
            if (difficulty === 'easy') return targets.easy;
            if (difficulty === 'medium') return targets.medium;
            if (difficulty === 'hard') return targets.hard;
            return 0;
        }

        function getXlsx() {
            if (!window.XLSX) { showExportDebug(['Export: Workbook Setup', 'Error: XLSX library failed to load. Please refresh and try again.']); showStatus('XLSX library failed to load. Please refresh and try again.'); return null; }
            return window.XLSX;
        }

        function createWorkbookFromRows(sheetName, rows) {
            const xlsx = getXlsx();
            if (!xlsx) return null;
            const workbook = xlsx.utils.book_new();
            const worksheet = xlsx.utils.json_to_sheet(rows);
            xlsx.utils.book_append_sheet(workbook, worksheet, sheetName);
            return { xlsx, workbook };
        }

        function pickWorkbookFile() {
            return new Promise((resolve) => {
                const input = document.createElement('input');
                input.type = 'file';
                input.accept = '.xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
                input.style.display = 'none';
                input.addEventListener('change', () => {
                    const file = input.files && input.files[0] ? input.files[0] : null;
                    input.remove();
                    resolve(file);
                }, { once: true });
                document.body.appendChild(input);
                input.click();
            });
        }

        async function readWorkbookFromPicker() {
            const xlsx = getXlsx();
            if (!xlsx) return null;
            const file = await pickWorkbookFile();
            if (!file) return null;
            const buffer = await file.arrayBuffer();
            return xlsx.read(buffer, { type: 'array' });
        }

        function getSheetRows(workbook, preferredName) {
            const xlsx = getXlsx();
            if (!xlsx || !workbook) return [];
            const sheetName = (preferredName && workbook.Sheets[preferredName]) ? preferredName : workbook.SheetNames[0];
            if (!sheetName || !workbook.Sheets[sheetName]) return [];
            return xlsx.utils.sheet_to_json(workbook.Sheets[sheetName], { defval: '' });
        }

        function parseDisplayDifficulty(value) {
            const normalized = String(value || '').trim().toLowerCase();
            if (normalized === 'hard' || normalized === 'max') return 'hard';
            if (normalized === 'easy' || normalized === 'min') return 'easy';
            return 'medium';
        }

        function normalizeAdventureRowFromImport(row, index) {
            const difficultyRaw = row.Difficulty ?? row.difficulty ?? '';
            const difficulty = String(difficultyRaw || '').trim();
            const normalizedDifficulty = normalizeEventLevel(difficulty);
            const silverRaw = row.Silver ?? row.silver ?? '';
            const productionRaw = row.Production ?? row.production ?? '';
            const silverManualColumn = row.SilverIsManual ?? row.silverIsManual;
            const productionManualColumn = row.ProductionIsManual ?? row.productionIsManual;
            const silverManual = String(silverManualColumn || '').trim() !== '' ? toYesNoBoolean(silverManualColumn) : false;
            const productionManual = String(productionManualColumn || '').trim() !== '' ? toYesNoBoolean(productionManualColumn) : false;
            const specialRequirementsCompletedColumn = row.SpecialRequirementsCompleted ?? row['Special Requirements Completed'] ?? row.specialRequirementsCompleted;
            return {
                no: String(row.No ?? row.no ?? index + 1),
                title: String(row.Title ?? row.title ?? ''),
                type: String(row.Type ?? row.type ?? ''),
                author: String(row.Author ?? row.author ?? ''),
                wc: String(row.WC ?? row.wc ?? ''),
                npcs: String(row.NPCs ?? row.npcs ?? ''),
                difficulty: difficulty ? titleCaseLevel(normalizedDifficulty) : '',
                apl: String(row.Apl ?? row.APL ?? row.apl ?? ''),
                silver: String(silverRaw),
                production: String(productionRaw),
                silverManual,
                productionManual,
                notes: String(row.Notes ?? row.notes ?? ''),
                schedulingNotes: String(row.SchedulingNotes ?? row['Scheduling Notes'] ?? row.schedulingNotes ?? ''),
                description: String(row.Description ?? row.description ?? ''),
                specialRequirements: String(row.SpecialRequirements ?? row['Special Requirements'] ?? row.specialRequirements ?? ''),
                specialRequirementsSource: String(row.SpecialRequirementsSource ?? row['Special Requirements Source'] ?? row.specialRequirementsSource ?? ''),
                specialRequirementsNotes: String(row.SpecialRequirementsNotes ?? row['Special Requirements Notes'] ?? row.specialRequirementsNotes ?? ''),
                specialRequirementsCompleted: String(specialRequirementsCompletedColumn || '').trim() !== '' ? toYesNoBoolean(specialRequirementsCompletedColumn) : false,
                received: toYesNoBoolean(row.Received ?? row.received),
                processed: toYesNoBoolean(row.Processed ?? row.processed),
                tagged: toYesNoBoolean(row.Tagged ?? row.tagged)
            };
        }

        function readTemplateBuildRows() {
            try { const raw = localStorage.getItem(templateBuildLogStorageKey); const parsed = raw ? JSON.parse(raw) : []; return Array.isArray(parsed) ? parsed : []; }
            catch (error) { console.error('Failed to read template builds:', error); return []; }
        }

        function writeTemplateBuildRows(rows) {
            localStorage.setItem(templateBuildLogStorageKey, JSON.stringify(rows));
            window.dispatchEvent(new CustomEvent('template-build-log-changed', { detail: rows }));
        }

        function buildTemplateExportRows() {
            return readTemplateBuildRows().map((row) => ({
                Id: row.id || '', Name: row.name || '', EventNumber: row.eventNumber || '', EventName: row.eventName || '', EventTitle: row.eventTitle || '',
                Level: row.level || '', RaceId: row.raceId || '', ClassId: row.classId || '', UsedBP: row.usedBP || '', Body: row.body || '',
                ArmourValue: row.armourValue ?? '', BuildJson: JSON.stringify(row.build || {}), CreatedAt: row.createdAt || '', UpdatedAt: row.updatedAt || ''
            }));
        }

        function normalizeTemplateRowFromImport(row, index) {
            const parseNumberOrBlank = (value) => { const trimmed = String(value ?? '').trim(); if (!trimmed) return ''; const parsed = Number(trimmed); return Number.isFinite(parsed) ? parsed : ''; };
            let build = {};
            try {
                const rawBuild = row.BuildJson ?? row.buildJson ?? '{}';
                const parsed = JSON.parse(String(rawBuild || '{}'));
                build = parsed && typeof parsed === 'object' ? parsed : {};
            } catch (error) {
                build = {};
            }
            return {
                id: String(row.Id ?? row.id ?? `template-build-import-${Date.now()}-${index}`).trim(),
                name: String(row.Name ?? row.name ?? '').trim(),
                eventNumber: String(row.EventNumber ?? row.eventNumber ?? '').trim(),
                eventName: String(row.EventName ?? row.eventName ?? '').trim(),
                eventTitle: String(row.EventTitle ?? row.eventTitle ?? '').trim(),
                level: parseNumberOrBlank(row.Level ?? row.level),
                raceId: String(row.RaceId ?? row.raceId ?? '').trim(),
                classId: String(row.ClassId ?? row.classId ?? '').trim(),
                usedBP: parseNumberOrBlank(row.UsedBP ?? row.usedBP),
                body: parseNumberOrBlank(row.Body ?? row.body),
                armourValue: parseNumberOrBlank(row.ArmourValue ?? row.armourValue),
                build,
                createdAt: String(row.CreatedAt ?? row.createdAt ?? new Date().toISOString()).trim(),
                updatedAt: String(row.UpdatedAt ?? row.updatedAt ?? '').trim()
            };
        }

        function hasAdventureSpecialRequirementsEntry(row) {
            return String(row?.specialRequirements ?? '').trim() !== ''
                || String(row?.specialRequirementsSource ?? '').trim() !== ''
                || String(row?.specialRequirementsNotes ?? '').trim() !== ''
                || row?.specialRequirementsCompleted === true;
        }

        function exportEventVariables() {
            const vars = eventVarsApi?.get?.() || {};
            const row = {
                EventName: vars.eventName || '', EventNumber: vars.eventNumber || '', TotalEventBuild: vars.totalEventBuild || '', Players: vars.players || '', EventDays: vars.eventDays || '', TotalAdventures: vars.totalAdventures || '', EventDifficulty: titleCaseLevel(vars.eventDifficulty || 'medium'), PlayersPerAdventure: vars.playersPerAdventure || '', UpdatedAt: vars.updatedAt || ''
            };
            const prepared = createWorkbookFromRows('Event Variables', [row]);
            if (!prepared) return;
            const fileName = `${safeFilePart(vars.eventName)}_Event_Variables.xlsx`;
            prepared.xlsx.writeFile(prepared.workbook, fileName);
            showExportDebug(['Export: Event Variables', 'Sheet: Event Variables', 'Rows exported: 1', `File: ${fileName}`]);
            showStatus(`Exported ${fileName}`);
        }

        function exportTemplates() {
            const rows = buildTemplateExportRows();
            if (!rows.length) { showExportDebug(['Export: Templates', 'Rows exported: 0']); showStatus('No saved templates to export.'); return; }
            const prepared = createWorkbookFromRows('Templates', rows);
            if (!prepared) return;
            const vars = eventVarsApi?.get?.() || {};
            const fileName = `${safeFilePart(vars.eventName)}_Templates.xlsx`;
            prepared.xlsx.writeFile(prepared.workbook, fileName);
            showExportDebug(['Export: Templates', 'Sheet: Templates', `Rows exported: ${rows.length}`, `File: ${fileName}`]);
            showStatus(`Exported ${fileName}`);
        }

        function buildLootRows(vars) {
            const totalEventBuild = parseNumber(vars.totalEventBuild);
            const players = parseNumber(vars.players);
            const eventDays = parseNumber(vars.eventDays);
            const floorInt = (value) => Math.floor(value);
            const roundInt = (value) => Math.round(value);
            const ceilInt = (value) => Math.ceil(value);
            const computeMid = (maxDrop, minimum) => floorInt((maxDrop + minimum) / 2);
            function createLootRow(label, maxDrop, minimum, options = {}) {
                return { label, maxDrop, minimum, mid: computeMid(maxDrop, minimum), isGroupTotal: Boolean(options.isGroupTotal), childLabels: Array.isArray(options.childLabels) ? options.childLabels : [] };
            }
            const totalSilver = ceilInt(totalEventBuild * 1.5);
            const type2MagicItems = floorInt((players * eventDays) / 25);
            const type1MagicItems = ceilInt((players * eventDays) / 10);
            const productionItems = ceilInt((totalEventBuild * eventDays) / 5);
            const cantripPages = roundInt((totalEventBuild * eventDays) / 50);
            const totalLevel1 = ceilInt(players * eventDays * 2);
            const p1 = roundInt(totalLevel1 * 0.45), c1 = roundInt(totalLevel1 * 0.1), e1 = roundInt(totalLevel1 * 0.1), s1 = roundInt(totalLevel1 * 0.1), sr1 = roundInt(totalLevel1 * 0.1), v1 = roundInt(totalLevel1 * 0.05), t1 = roundInt(totalLevel1 * 0.05), d1 = roundInt(totalLevel1 * 0.05);
            const totalLevel2 = ceilInt((players * eventDays * 2) / 10);
            const p2 = roundInt(totalLevel2 * 0.4), c2 = roundInt(totalLevel2 * 0.15), e2 = roundInt(totalLevel2 * 0.15), s2 = roundInt(totalLevel2 * 0.15), v2 = roundInt(totalLevel2 * 0.05), t2 = roundInt(totalLevel2 * 0.05), d2 = roundInt(totalLevel2 * 0.05);
            const totalLevel4 = roundInt((players * eventDays) / 25);
            const p4 = roundInt(totalLevel4 * 0.4), c4 = roundInt(totalLevel4 * 0.15), e4 = roundInt(totalLevel4 * 0.15), s4 = roundInt(totalLevel4 * 0.15), v4 = roundInt(totalLevel4 * 0.05), t4 = roundInt(totalLevel4 * 0.05), d4 = roundInt(totalLevel4 * 0.05);
            return [
                createLootRow('Total Silver', totalSilver, totalSilver),
                createLootRow('Type 2 Magic Items', type2MagicItems, floorInt(type2MagicItems / 2)),
                createLootRow('Type 1 Magic Items', type1MagicItems, floorInt(type1MagicItems / 2)),
                createLootRow('Production Items', productionItems, floorInt(productionItems / 2)),
                createLootRow('Cantrip Pages', cantripPages, floorInt(cantripPages / 2)),
                createLootRow('Total Level 1 Formal Components', totalLevel1, floorInt(totalLevel1 / 2), { isGroupTotal: true, childLabels: ['P1', 'C1', 'E1', 'S1', 'SR1', 'V1', 'T1', 'D1'] }),

        function findAdventureRowIndex(existingRows, candidate) {

            return existingRows.findIndex((row) => {
                const rowNo = String(row?.no ?? '').trim().toLowerCase();
                const rowTitle = String(row?.title ?? '').trim().toLowerCase();

        async function importAdventureSpecialRequirements() {
            try {

                if (!workbook) {
                    showImportDebug(['Import: Adventure Special Requirements', 'Status: Cancelled before file selection completed.']);
                    showStatus('Import cancelled.');
                    return;
                }
                const importedRows = getSheetRows(workbook, 'Adventure Special Requirements');
                if (!importedRows.length) {
                    showImportDebug(['Import: Adventure Special Requirements', 'Sheet: Adventure Special Requirements', 'Rows found: 0']);
                    showStatus('No Adventure Special Requirements rows found in workbook.');
                    return;
                }
                const normalizedRows = importedRows.map((row, index) => ({
                    no: String(row.No ?? row.no ?? index + 1),
                    title: String(row.Title ?? row.title ?? ''),
                    author: String(row.Author ?? row.author ?? ''),
                    specialRequirements: String(row.SpecialRequirements ?? row['Special Requirements'] ?? row.specialRequirements ?? '').trim(),
                    specialRequirementsSource: String(row.Source ?? row.SpecialRequirementsSource ?? row['Special Requirements Source'] ?? row.specialRequirementsSource ?? '').trim(),
                    specialRequirementsNotes: String(row.Notes ?? row.SpecialRequirementsNotes ?? row['Special Requirements Notes'] ?? row.specialRequirementsNotes ?? '').trim(),
                    specialRequirementsCompleted: toYesNoBoolean(row.Completed ?? row['Completed (Y/N)'] ?? row.SpecialRequirementsCompleted ?? row['Special Requirements Completed'] ?? row.specialRequirementsCompleted)
                })).filter((row) => row.specialRequirements !== '' || row.specialRequirementsSource !== '' || row.specialRequirementsNotes !== '' || row.specialRequirementsCompleted);
                if (!normalizedRows.length) {
                    showImportDebug(['Import: Adventure Special Requirements', `Rows found: ${importedRows.length}`, 'Rows with special requirements: 0']);
                    showStatus('No rows had Special Requirements, nothing was imported.');
                    return;
                }
                const existingRows = readStoredAdventureRows();
                const updatedRows = existingRows.map((row) => ({ ...row }));
                normalizedRows.forEach((row) => {
                    const matchIndex = findAdventureRowIndex(updatedRows, row);
                    if (matchIndex >= 0) {
                        updatedRows[matchIndex].specialRequirements = row.specialRequirements;
                        updatedRows[matchIndex].specialRequirementsSource = row.specialRequirementsSource;
                        updatedRows[matchIndex].specialRequirementsNotes = row.specialRequirementsNotes;
                        updatedRows[matchIndex].specialRequirementsCompleted = row.specialRequirementsCompleted;
                    } else {
                        updatedRows.push({ no: row.no, title: row.title, author: row.author, specialRequirements: row.specialRequirements, specialRequirementsSource: row.specialRequirementsSource, specialRequirementsNotes: row.specialRequirementsNotes, specialRequirementsCompleted: row.specialRequirementsCompleted, type: '', npcs: '', difficulty: '', apl: '', silver: '', production: '', silverManual: false, productionManual: false, notes: '', wc: '', schedulingNotes: '', description: '', received: false, processed: false, tagged: false });
                    }
                });
                localStorage.setItem(adventureStorageKey, JSON.stringify({ rows: updatedRows }));
                showImportDebug([
                    'Import: Adventure Special Requirements',
                    `Rows found: ${importedRows.length}`,
                    `Rows imported: ${normalizedRows.length}`,
                    `Rows after merge: ${updatedRows.length}`
                ]);
                showStatus(`Imported ${normalizedRows.length} Special Requirements rows.`);
            } catch (error) {
                console.error('Failed to import Adventure Special Requirements workbook:', error);
                showImportDebug(['Import: Adventure Special Requirements', `Error: ${String(error?.message || error)}`]);
                showStatus('Could not import Adventure Special Requirements workbook.');
            }
        }

        async function importTemplates() {
            try {
                const workbook = await readWorkbookFromPicker();
                if (!workbook) {
                    showImportDebug(['Import: Templates', 'Status: Cancelled before file selection completed.']);
                    showStatus('Import cancelled.');
                    return;
                }
                const rows = getSheetRows(workbook, 'Templates');
                if (!rows.length) {
                    showImportDebug(['Import: Templates', 'Sheet: Templates', 'Rows found: 0']);
                    showStatus('No Templates rows found in workbook.');
                    return;
                }
                const normalizedRows = rows.map((row, index) => normalizeTemplateRowFromImport(row, index)).filter((row) => row.name);
                if (!normalizedRows.length) {
                    showImportDebug(['Import: Templates', `Rows found: ${rows.length}`, 'Valid rows: 0']);
                    showStatus('No valid templates found to import.');
                    return;
                }
                writeTemplateBuildRows(normalizedRows);
                showImportDebug([
                    'Import: Templates',
                    `Rows found: ${rows.length}`,
                    `Rows imported: ${normalizedRows.length}`
                ]);
                showStatus(`Imported ${normalizedRows.length} templates.`);
            } catch (error) {
                console.error('Failed to import Templates workbook:', error);
                showImportDebug(['Import: Templates', `Error: ${String(error?.message || error)}`]);
                showStatus('Could not import Templates workbook.');
            }
        }

        async function exportAllWorkbooks() {
            try {
                exportEventVariables();
                exportLootCalculation();
                exportAdventureListing();
                exportAdventureLevelling();
                exportTemplates();
                await exportAdventureSpecialRequirements();
                await exportFeedbackSheet();
                showExportDebug(['Export: All', 'Status: Complete', 'Files attempted: Event Variables, Loot Calculation, Adventure Listing, Adventure Levelling, Templates, Adventure Special Requirements, Feedback Sheet']);
                showStatus('Export All complete. Check your downloads for all workbook files.');
            } catch (error) {
                console.error('Failed during Export All:', error);
                showExportDebug(['Export: All', 'Status: Error', `Error: ${String(error?.message || error)}`]);
                showStatus('Export All encountered an error. Some files may still have exported.');
            }
        }

        exportEventVarsBtn.addEventListener('click', exportEventVariables);
        exportLootCalcBtn.addEventListener('click', exportLootCalculation);
        exportAdventureListingBtn.addEventListener('click', exportAdventureListing);
        exportAdventureLevellingBtn.addEventListener('click', exportAdventureLevelling);
        exportAdventureSpecialReqsBtn.addEventListener('click', exportAdventureSpecialRequirements);
        exportTemplatesBtn.addEventListener('click', exportTemplates);
        exportFeedbackSheetBtn.addEventListener('click', exportFeedbackSheet);
        exportAllBtn.addEventListener('click', exportAllWorkbooks);
        importEventVarsBtn.addEventListener('click', importEventVariables);
        importLootCalcBtn.addEventListener('click', importLootCalculation);
        importAdventureListingBtn.addEventListener('click', importAdventureListing);
        importAdventureLevellingBtn.addEventListener('click', importAdventureLevelling);
        importAdventureSpecialReqsBtn.addEventListener('click', importAdventureSpecialRequirements);
        importTemplatesBtn.addEventListener('click', importTemplates);

        showImportDebug([]);
        showStatus('Ready.');
    </script>
</body>
</html>
